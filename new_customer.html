<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Data Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --bg-panel: #f8f9fa;
            --border: #e5e7eb;
            --text-dark: #1f2937;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #525659;
            height: 100vh;
            display: flex;
            flex-direction: row; 
            overflow: hidden;
        }

        /* --- PDF Viewer (Left/Top) --- */
        #viewer-container {
            flex: 1;
            height: 100%;
            overflow: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #525659;
            min-width: 0;
        }

        .pdf-page-container {
            position: relative;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background: white;
            user-select: none;
            line-height: 0;
        }

        canvas { max-width: none; display: block; }

        .marker {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #ef4444;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .floating-input-wrapper {
            position: absolute;
            background: white;
            padding: 5px;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            gap: 5px;
            z-index: 1000;
            transform: translate(-50%, -130%);
            min-width: 200px;
            border: 1px solid #ccc;
        }

        /* --- Sidebar (Form Area) --- */
        #sidebar {
            width: 380px;
            min-width: 380px;
            background: white;
            display: flex;
            flex-direction: column;
            z-index: 20;
            border-inline-start: 1px solid #ccc;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 12px;
            background: #f1f5f9;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }

        .zoom-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 4px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            font-size: 16px;
        }

        .action-btn { 
            width: 100%; padding: 12px; cursor: pointer; 
            background: var(--primary); color: white; border: none; 
            border-radius: 6px; font-weight: 600;
        }

        #form-container { flex: 1; overflow-y: auto; }

        .form-row {
            display: grid;
            grid-template-columns: 100px 1fr 35px 30px;
            border-bottom: 1px solid #eee;
            min-height: 44px;
        }

        .form-label {
            background: #f8fafc; padding: 8px; font-size: 11px; font-weight: bold;
            color: #475569; display: flex; align-items: center; border-inline-end: 1px solid #eee;
        }

        .form-value input {
            width: 100%; border: none; padding: 10px; font-family: monospace; font-size: 14px; outline: none;
        }

        .preview-col { display: flex; align-items: center; justify-content: center; border-inline-start: 1px solid #eee; }
        .form-controls { display: flex; flex-direction: column; border-inline-start: 1px solid #eee; }
        
        .mini-btn { border: none; background: transparent; font-size: 12px; color: #94a3b8; cursor: pointer; flex: 1; }
        .btn-clear { color: #ef4444; font-weight: bold; }
        
        .btn-preview { 
            background: none; border: none; font-size: 18px; color: var(--primary); 
            cursor: pointer; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
        }
        .btn-preview:hover { background: #f0f7ff; }

        .form-row.filled { background: #f0f9ff; }

        /* --- Floating Image Modal --- */
        #image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            position: relative;
            max-width: 95%;
            max-height: 95%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #modal-img {
            max-width: 100%;
            max-height: 90vh;
            border: 4px solid white;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            background: white;
        }
        .close-modal {
            position: absolute;
            top: -45px;
            right: 0;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 45vh; min-width: 100%; }
        }

        #upload-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; z-index: 2000; display: flex;
            flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%;
            width: 40px; height: 40px; animation: spin 1s linear infinite; display: none; margin-top: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="upload-overlay">
        <h2>📂 Open PDF</h2>
        <input type="file" id="file-input" accept="application/pdf">
        <div class="loader" id="loader"></div>
    </div>

    <!-- النافذة العائمة للصور -->
    <div id="image-modal" onclick="closeImageModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeImageModal()">&times;</span>
            <img id="modal-img" src="" alt="Preview">
        </div>
    </div>

    <div id="viewer-container"></div>

    <div id="sidebar">
        <div class="sidebar-header">
            <div class="header-top">
                <button class="lang-btn" onclick="toggleLanguage()" style="background: #334155; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer;">عربي / EN</button>
                <div style="font-size:12px; color:#555;">Filled: <span id="filled-count">0</span>/12</div>
            </div>

            <div class="zoom-controls">
                <button class="zoom-btn" onclick="changeZoom(-0.2)">−</button>
                <span id="zoom-level" style="font-size:13px; font-weight:bold;">100%</span>
                <button class="zoom-btn" onclick="changeZoom(0.2)">+</button>
                <button onclick="fitToWidth()" style="font-size: 11px; padding: 4px 8px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer;">Fit Width</button>
            </div>

            <button class="action-btn" id="copy-btn" onclick="copyAll()">Copy Data (-)</button>
        </div>
        
        <div id="form-container"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const fieldsConfig = [
            { key: 'store', ar: 'اسم المحل', en: 'Store Name', img: 'https://i.ibb.co/QS64sQv/name.png' },
            { key: 'cr', ar: 'رقم السجل', en: 'CR Number', img: 'https://i.ibb.co/tMFfW4rS/cr-number.png' },
            { key: 'license', ar: 'رقم الرخصة', en: 'License Num', img: 'https://i.ibb.co/Rps00MVc/licen-number.png' },
            { key: 'tax', ar: 'الرقم الضريبي', en: 'Tax Number', img: 'https://i.ibb.co/S4tS0SfK/vat-number.png' },
            { key: 'mobile', ar: 'رقم الجوال', en: 'Mobile Num', img: '' },
            { key: 'zip', ar: 'الرمز البريدي', en: 'Zip Code', img: 'https://i.ibb.co/jPYLs91S/postal.png' },
            { key: 'building', ar: 'رقم المبني', en: 'Building Num', img: 'https://i.ibb.co/nszKXs03/bulding.png' },
            { key: 'additional', ar: 'الرقم الاضافي', en: 'Additional Num', img: 'https://i.ibb.co/TMQCHS1Q/add.png' },
            { key: 'district', ar: 'اسم الحي', en: 'District', img: 'https://i.ibb.co/QSdK6yz/distract.png' },
            { key: 'street', ar: 'اسم الشارع', en: 'Street', img: 'https://i.ibb.co/ycKffvyW/street.png' }, // تم تحديث الرابط هنا
            { key: 'short', ar: 'الموقع المختصر', en: 'Short Address', img: 'https://i.ibb.co/JRN93Tjg/shortcode.png' },
            { key: 'coords', ar: 'احداثيات الموقع', en: 'Coordinates', img: 'https://i.ibb.co/Qv0zM7s6/cordinate.png' }
        ];

        let formData = new Array(12).fill(null).map(() => ({ value: '', markerData: null }));
        let currentLang = 'ar';
        let pdfDoc = null;
        let currentScale = 1.2;

        const formContainer = document.getElementById('form-container');
        const filledCount = document.getElementById('filled-count');
        const fileInput = document.getElementById('file-input');
        const viewer = document.getElementById('viewer-container');
        const overlay = document.getElementById('upload-overlay');
        const loader = document.getElementById('loader');
        const zoomLevelEl = document.getElementById('zoom-level');

        function initForm() {
            formContainer.innerHTML = '';
            fieldsConfig.forEach((field, index) => {
                const row = document.createElement('div');
                row.className = 'form-row';
                row.id = `row-${index}`;
                
                const previewBtn = field.img ? 
                    `<div class="preview-col"><button class="btn-preview" onclick="openImageModal('${field.img}')" title="Preview Area">👁️</button></div>` : 
                    `<div class="preview-col"></div>`;

                row.innerHTML = `
                    <div class="form-label">${currentLang === 'ar' ? field.ar : field.en}</div>
                    <div class="form-value"><input type="text" id="input-${index}" oninput="updateValueManually(${index}, this.value)" placeholder="..."></div>
                    ${previewBtn}
                    <div class="form-controls">
                        <button class="mini-btn" onclick="moveValue(${index}, -1)">▲</button>
                        <button class="mini-btn btn-clear" onclick="clearRow(${index})">×</button>
                        <button class="mini-btn" onclick="moveValue(${index}, 1)">▼</button>
                    </div>`;
                formContainer.appendChild(row);
            });
            updateFormUI();
        }

        // دوال النافذة العائمة
        function openImageModal(url) {
            const modal = document.getElementById('image-modal');
            const img = document.getElementById('modal-img');
            img.src = url;
            modal.style.display = 'flex';
        }

        function closeImageModal() {
            document.getElementById('image-modal').style.display = 'none';
        }

        async function fitToWidth() {
            if (!pdfDoc) return;
            const page = await pdfDoc.getPage(1);
            const viewport = page.getViewport({ scale: 1 });
            const availableWidth = viewer.clientWidth - 40; 
            currentScale = availableWidth / viewport.width;
            zoomLevelEl.innerText = Math.round(currentScale * 100) + "%";
            renderPDF();
        }

        function changeZoom(delta) {
            if (!pdfDoc) return;
            currentScale = Math.min(Math.max(currentScale + delta, 0.3), 4.0);
            zoomLevelEl.innerText = Math.round(currentScale * 100) + "%";
            renderPDF();
        }

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            loader.style.display = 'block';
            const reader = new FileReader();
            reader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
                overlay.style.display = 'none';
                initForm();
                await fitToWidth();
            };
            reader.readAsArrayBuffer(file);
        });

        async function renderPDF() {
            if (!pdfDoc) return;
            viewer.innerHTML = '';
            for(let i=1; i<=pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const viewport = page.getViewport({scale: currentScale});
                const wrapper = document.createElement('div');
                wrapper.className = 'pdf-page-container';
                wrapper.style.width = viewport.width + "px";
                wrapper.style.height = viewport.height + "px";
                
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                wrapper.appendChild(canvas);
                viewer.appendChild(wrapper);
                
                wrapper.addEventListener('click', (e) => handleMapClick(e, wrapper, i-1));
                await page.render({canvasContext: canvas.getContext('2d'), viewport: viewport}).promise;
                recreateMarkers(i-1, wrapper);
            }
        }

        function recreateMarkers(pageIdx, wrapper) {
            formData.forEach((data, index) => {
                if (data.markerData && data.markerData.pageIdx === pageIdx) {
                    const marker = document.createElement('div');
                    marker.className = 'marker';
                    marker.style.left = data.markerData.percentX + '%';
                    marker.style.top = data.markerData.percentY + '%';
                    wrapper.appendChild(marker);
                    formData[index].markerElement = marker;
                }
            });
        }

        function handleMapClick(e, wrapper, pageIdx) {
            if(['INPUT','BUTTON'].includes(e.target.tagName)) return;
            const rect = wrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            createFloatingInput(wrapper, x, y, pageIdx);
        }

        function createFloatingInput(parent, x, y, pageIdx) {
            const existing = document.querySelector('.floating-input-wrapper');
            if(existing) existing.remove();

            const div = document.createElement('div');
            div.className = 'floating-input-wrapper';
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            const input = document.createElement('input');
            input.type = 'text';
            input.style.flex = "1";
            input.style.padding = "8px";
            setTimeout(() => input.focus(), 50);
            const btn = document.createElement('button');
            btn.innerHTML = '✔';
            btn.style.padding = "0 15px";
            btn.style.background = "var(--primary)"; btn.style.color = "white"; btn.style.border = "none"; btn.style.borderRadius = "4px";

            const submit = () => {
                if(input.value.trim()) assignToNextEmptySlot(input.value, x, y, parent, pageIdx);
                div.remove();
            };
            btn.onclick = submit;
            input.onkeydown = (e) => { if(e.key === 'Enter') submit(); };
            div.appendChild(input); div.appendChild(btn);
            parent.appendChild(div);
        }

        function assignToNextEmptySlot(text, x, y, parent, pageIdx) {
            const idx = formData.findIndex(item => item.value === '');
            if(idx === -1) return alert("All slots are full!");
            const px = (x / parent.offsetWidth) * 100;
            const py = (y / parent.offsetHeight) * 100;
            const marker = document.createElement('div');
            marker.className = 'marker';
            marker.style.left = px + '%'; marker.style.top = py + '%';
            parent.appendChild(marker);
            formData[idx] = { value: text, markerElement: marker, markerData: { percentX: px, percentY: py, pageIdx } };
            updateFormUI();
        }

        function clearRow(index) {
            if(formData[index].markerElement) formData[index].markerElement.remove();
            formData[index] = { value: '', markerElement: null, markerData: null };
            updateFormUI();
        }

        function updateValueManually(index, val) { formData[index].value = val; updateFormUI(false); }

        function moveValue(index, dir) {
            const newIdx = index + dir;
            if(newIdx < 0 || newIdx >= 12) return;
            [formData[index], formData[newIdx]] = [formData[newIdx], formData[index]];
            updateFormUI();
        }

        function updateFormUI(refresh = true) {
            let count = 0;
            formData.forEach((data, i) => {
                const row = document.getElementById(`row-${i}`);
                if(refresh) {
                    const input = document.getElementById(`input-${i}`);
                    if(input) input.value = data.value;
                }
                if(data.value) { row.classList.add('filled'); count++; } else row.classList.remove('filled');
            });
            filledCount.innerText = count;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            const currentValues = formData.map(d => d.value);
            initForm();
            currentValues.forEach((v, i) => { 
                if(v) {
                    const inp = document.getElementById(`input-${i}`);
                    if(inp) inp.value = v;
                }
            });
        }

        function copyAll() {
            const text = formData.map(d => d.value.trim()).join('-');
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn');
                const old = btn.innerText;
                btn.innerText = "COPIED!";
                setTimeout(() => btn.innerText = old, 1000);
            });
        }

        initForm();
    </script>
</body>
</html>
