<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle Quality Pro - V3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استخدام نسخة 0.11.6 المستقرة جداً -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #0a0a0a; color: white; }
        .eagle-card { background: #141414; border: 1px solid #222; border-radius: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .loading-bar { height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
        .loading-progress { width: 0%; height: 100%; background: #25D366; transition: width 0.3s; box-shadow: 0 0 15px #25D366; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="max-w-md w-full eagle-card p-8 relative overflow-hidden">
    <!-- Status Header -->
    <div id="setup-status" class="mb-6 text-center">
        <div class="inline-block px-4 py-1 rounded-full bg-yellow-500/10 text-yellow-500 text-[10px] font-bold uppercase tracking-widest mb-2" id="status-tag">
            جاري تهيئة المحرك...
        </div>
        <h1 class="text-2xl font-black">Eagle Optimizer</h1>
    </div>

    <!-- Upload Area -->
    <div id="drop-zone" class="border-2 border-dashed border-zinc-800 rounded-3xl p-10 text-center cursor-pointer hover:border-green-500 transition-all mb-6 group">
        <input type="file" id="file-input" class="hidden" accept="image/*,video/*">
        <div id="upload-ui">
            <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">📁</div>
            <p class="text-zinc-400 text-sm font-bold">ارفع الفيديو أو الصورة</p>
        </div>
        <div id="selected-ui" class="hidden">
            <p class="text-green-500 font-bold text-sm">تم اختيار الملف ✓</p>
            <p id="file-name" class="text-[10px] text-zinc-500 mt-1"></p>
        </div>
    </div>

    <!-- Progress UI (Hidden) -->
    <div id="progress-container" class="hidden mb-6">
        <div class="flex justify-between text-[10px] font-bold mb-2 uppercase">
            <span class="text-green-500">جاري المعالجة بدقة عالية</span>
            <span id="progress-text">0%</span>
        </div>
        <div class="loading-bar">
            <div id="progress-bar" class="loading-progress"></div>
        </div>
        <p id="eta" class="text-[9px] text-zinc-600 mt-2 text-center uppercase tracking-tighter">يتم الآن تطبيق إعدادات Profile High 4.2</p>
    </div>

    <!-- Action Button -->
    <button id="start-btn" disabled class="w-full bg-white text-black font-black py-4 rounded-2xl disabled:opacity-20 transition-all hover:bg-green-500 hover:text-white uppercase tracking-widest text-sm">
        بدء التصدير النهائي
    </button>

    <!-- Logs for debugging -->
    <div id="logs" class="mt-6 text-[8px] font-mono text-zinc-700 h-16 overflow-y-auto border-t border-zinc-900 pt-2"></div>
</div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    
    // إعداد FFmpeg بنسخة Single-thread لضمان عدم التجمد محلياً
    const ffmpeg = createFFmpeg({ 
        log: true,
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
    });

    const fileInput = document.getElementById('file-input');
    const startBtn = document.getElementById('start-btn');
    const logs = document.getElementById('logs');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');

    function log(msg) {
        const div = document.createElement('div');
        div.innerText = msg;
        logs.appendChild(div);
        logs.scrollTop = logs.scrollHeight;
    }

    // تهيئة المحرك عند التحميل
    (async () => {
        try {
            await ffmpeg.load();
            document.getElementById('status-tag').innerText = "المحرك جاهز للاستخراج";
            document.getElementById('status-tag').className = "inline-block px-4 py-1 rounded-full bg-green-500/10 text-green-500 text-[10px] font-bold uppercase tracking-widest mb-2";
        } catch (e) {
            log("خطأ في التحميل: " + e.message);
        }
    })();

    fileInput.onchange = (e) => {
        if (e.target.files[0]) {
            startBtn.disabled = false;
            document.getElementById('upload-ui').classList.add('hidden');
            document.getElementById('selected-ui').classList.remove('hidden');
            document.getElementById('file-name').innerText = e.target.files[0].name;
        }
    };

    document.getElementById('drop-zone').onclick = () => fileInput.click();

    startBtn.onclick = async () => {
        const file = fileInput.files[0];
        if (!file) return;

        startBtn.disabled = true;
        document.getElementById('progress-container').classList.remove('hidden');

        const inName = 'input_file';
        const outName = 'eagle_final.mp4';

        log("جاري قراءة الملف...");
        await ffmpeg.writeFile(inName, await fetchFile(file));

        ffmpeg.setProgress(({ ratio }) => {
            const p = Math.round(ratio * 100);
            progressBar.style.width = p + '%';
            progressText.innerText = p + '%';
        });

        // أوامر الـ Metadata المطابقة 100% للفيديو المرفق:
        // -c:v libx264 : الكوديك العالمي
        // -pix_fmt yuv420p : لضمان عمله على واتساب بدون تلف
        // -profile:v high -level 4.2 : إعدادات دقة Eagle
        // -crf 18 : جودة فائقة جداً
        const isImage = file.type.startsWith('image');
        let args = [
            '-i', inName,
            '-vf', 'scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1',
            '-c:v', 'libx264',
            '-profile:v', 'high',
            '-level', '4.2',
            '-crf', '18',
            '-pix_fmt', 'yuv420p',
            '-r', '30',
            '-movflags', '+faststart',
            outName
        ];

        if (isImage) {
            args = ['-loop', '1', '-t', '10', ...args];
        }

        log("بدأ الترميز الاحترافي...");
        await ffmpeg.run(...args);

        log("جاري استخراج الملف النهائي...");
        const data = ffmpeg.readFile(outName);
        const blob = new Blob([data.buffer], { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = 'Eagle_HQ_WhatsApp.mp4';
        a.click();

        log("تم بنجاح!");
        startBtn.disabled = false;
        document.getElementById('status-tag').innerText = "تم التحميل بنجاح ✓";
    };
</script>

</body>
</html>
