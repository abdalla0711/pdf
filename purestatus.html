<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول Eagle الاحترافي</title>
    <!-- حل مشكلة الأمان تلقائياً -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/coi-serviceworker/0.1.7/coi-serviceworker.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.umd.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #0c0c0c; color: white; }
        .mobile-ui { max-width: 480px; width: 100%; background: #151515; border-radius: 40px; border: 1px solid #222; overflow: hidden; }
        .upload-active { border-color: #25D366 !important; background: rgba(37, 211, 102, 0.05); }
        .btn-primary { background: #25D366; color: black; font-weight: 900; transition: 0.3s; }
        .btn-primary:disabled { background: #333; color: #666; cursor: not-allowed; }
        #loading-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #222; border-top-color: #25D366; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<!-- شاشة التحميل الأولية -->
<div id="loading-screen">
    <div class="spinner mb-4"></div>
    <p class="text-sm font-bold tracking-widest text-gray-400">جاري تجهيز مختبر الجودة...</p>
    <p class="text-[10px] text-gray-600 mt-2 italic">سيتم إعادة تشغيل الصفحة مرة واحدة تلقائياً لضبط الأمان</p>
</div>

<div class="mobile-ui shadow-2xl">
    <!-- Header -->
    <div class="p-8 text-center border-b border-white/5">
        <h1 class="text-2xl font-black text-white">EAGLE <span class="text-green-500">PRO</span></h1>
        <p class="text-[10px] text-gray-500 uppercase mt-1 tracking-[0.3em]">WhatsApp Status Engine</p>
    </div>

    <div class="p-8">
        <!-- منطقة الرفع -->
        <div id="drop-zone" class="border-2 border-dashed border-gray-800 rounded-3xl p-10 text-center transition-all cursor-pointer hover:bg-white/5 group relative">
            <input type="file" id="file-input" class="absolute inset-0 opacity-0 cursor-pointer" accept="image/*,video/*">
            
            <div id="upload-content">
                <div class="w-16 h-16 bg-white/5 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                    <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.587-1.587a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <p class="text-sm font-bold">اضغط هنا لرفع الملف</p>
                <p class="text-[10px] text-gray-500 mt-2 italic">الصور سيتم تحويلها لفيديو 10 ثوانٍ</p>
            </div>

            <div id="selected-content" class="hidden">
                <p class="text-green-500 font-black mb-1">تم اختيار الملف ✓</p>
                <p id="file-name" class="text-[10px] text-gray-400 truncate px-4"></p>
            </div>
        </div>

        <!-- Progress Bar -->
        <div id="progress-area" class="mt-8 hidden">
            <div class="flex justify-between text-[10px] font-black text-green-500 mb-2 uppercase">
                <span>جاري المعالجة القصوى</span>
                <span id="pct">0%</span>
            </div>
            <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden">
                <div id="fill" class="h-full bg-green-500 w-0 transition-all"></div>
            </div>
        </div>

        <!-- Action Button -->
        <button id="start-btn" disabled class="btn-primary w-full py-5 rounded-2xl mt-8 shadow-xl shadow-green-500/10 uppercase tracking-widest text-xs">
            بدء التصدير بجودة Eagle
        </button>
    </div>

    <!-- Footer Console -->
    <div id="console" class="bg-black/50 p-4 h-24 overflow-y-auto font-mono text-[9px] text-gray-600 border-t border-white/5">
        -- المحرك في حالة انتظار --
    </div>
</div>

<script>
    const { FFmpeg } = ffmpeg;
    const { fetchFile, toBlobURL } = ffmpegUtil;

    let ff = null;
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const startBtn = document.getElementById('start-btn');
    const loadingScreen = document.getElementById('loading-screen');
    const consoleBox = document.getElementById('console');

    function log(m) {
        const d = document.createElement('div');
        d.innerText = "> " + m;
        consoleBox.appendChild(d);
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    // تهيئة المحرك
    async function initFFmpeg() {
        ff = new FFmpeg();
        const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
        
        try {
            await ff.load({
                coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
            });
            log("تم تفعيل المحرك بنجاح");
            loadingScreen.style.display = 'none'; // إخفاء شاشة التحميل عند الجاهزية
        } catch (e) {
            log("خطأ أمني: تأكد من تشغيل الملف عبر Live Server");
            console.error(e);
        }
    }

    // التعامل مع اختيار الملف
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            document.getElementById('upload-content').classList.add('hidden');
            document.getElementById('selected-content').classList.remove('hidden');
            document.getElementById('file-name').innerText = file.name;
            dropZone.classList.add('upload-active');
            startBtn.disabled = false;
            log("تم استلام الملف: " + file.name);
        }
    });

    // بدء المعالجة
    startBtn.onclick = async () => {
        const file = fileInput.files[0];
        if (!file) return;

        startBtn.disabled = true;
        document.getElementById('progress-area').classList.remove('hidden');

        const inName = 'input_raw';
        const outName = 'eagle_hq_status.mp4';

        await ff.writeFile(inName, await fetchFile(file));

        ff.on('progress', ({ progress }) => {
            const p = Math.round(progress * 100);
            document.getElementById('fill').style.width = p + '%';
            document.getElementById('pct').innerText = p + '%';
        });

        ff.on('log', ({ message }) => log(message));

        // إعدادات الميتا داتا والجودة للفيديو المرفق (Eagle)
        let args = [
            '-i', inName,
            '-vf', 'scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1',
            '-c:v', 'libx264',
            '-profile:v', 'high',
            '-level', '4.2',
            '-crf', '18',
            '-pix_fmt', 'yuv420p',
            '-r', '30',
            '-movflags', '+faststart',
            outName
        ];

        if (file.type.startsWith('image')) {
            args = ['-loop', '1', '-t', '10', ...args];
        }

        log("جاري تطبيق خوارزمية الضغط العالي...");
        await ff.exec(args);

        const data = await ff.readFile(outName);
        const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));

        const a = document.createElement('a');
        a.href = url;
        a.download = 'Eagle_HQ_WhatsApp.mp4';
        a.click();

        log("تم الاستخراج بنجاح! تحقق من التنزيلات.");
        startBtn.disabled = false;
    };

    // تشغيل التهيئة
    initFFmpeg();
</script>

</body>
</html>
