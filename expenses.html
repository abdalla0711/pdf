    <style>

            font-family: 'EagleFont';

        :root {

        .view.active { display: block; }

        .card { 
            background: var(--card-bg); border-radius: 20px; padding: 20px; 
            margin-bottom: 20px; border: 1px solid var(--border); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);

        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #64748b; }
        input, select, textarea { 
            width: 100%; border: 1.5px solid var(--border); border-radius: 12px; 
            padding: 12px 15px; font-size: 15px; background: #fff; outline: none; transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1); }
        
        /* تنبيه الإدخال بعد المسح */

        .btn { 
            width: 100%; padding: 16px; border: none; border-radius: 14px; 
            font-size: 15px; font-weight: 700; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s;

        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 10px rgba(13, 148, 136, 0.2); }
        .btn-amber { background: var(--warning); color: #fff; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: #fff; border: 1.5px solid var(--border); color: var(--primary); }
        .btn-outline.active-tax { background: var(--accent); color: white; border-color: var(--accent); }

        /* السجل */
        .expense-item { 
            background: #fff; border-radius: 18px; padding: 18px; 
            margin-bottom: 15px; border: 1px solid var(--border); 
        }
        .item-head { display: flex; justify-content: space-between; font-weight: 900; color: var(--accent); margin-bottom: 10px; font-size: 16px; }

        nav { 
            position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.9); 
            backdrop-filter: blur(10px); display: flex; border-top: 1px solid var(--border); 
            max-width: 500px; margin: 0 auto; z-index: 1000; padding: 10px;
        }
        nav button { 
            flex: 1; padding: 12px; border: none; background: none; 
            color: #94a3b8; font-weight: 700; border-radius: 12px;
        }
        nav button.active { color: var(--accent); background: rgba(13, 148, 136, 0.1); }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: #fff; border-radius: 25px; width: 100%; max-width: 350px; padding: 30px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }

        /* ترويسة QR */
        .btn-scan-qr { 
            width: 100%; padding: 12px; border: 2px dashed var(--accent); border-radius: 15px; 
            background: #f0fdfa; color: var(--accent); font-weight: 800; margin-bottom: 15px;
        }

        /* الطباعة */
        #print-wrap { width: 58mm; padding: 2mm; background: white; display: none; color: #000; font-size: 10px; }
        #print-a4-wrap { width: 210mm; padding: 15mm; background: white; display: none; color: #000; }
        .a4-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
        .a4-table th, .a4-table td { border: 1px solid #ddd; padding: 8px; text-align: right; }
        .a4-table th { background: #f4f4f4; }
        .a4-header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<body>

<div class="app">
    <header>
        <div style="font-size: 24px; font-weight: 900; letter-spacing: 1px;">ايجل للتجارة</div>
        <div id="stat-bar" style="font-size: 13px; margin-top: 8px; font-weight: 300; background: rgba(255,255,255,0.1); display: inline-block; padding: 4px 12px; border-radius: 20px;"></div>
    </header>

    <main>
        <section id="view-entry" class="view active">
            <div class="card">
                <label>نوع الفاتورة</label>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-outline" id="t-off" onclick="toggleTax(false)">سند عادي</button>
                    <button class="btn btn-outline" id="t-on" onclick="toggleTax(true)">فاتورة ضريبية</button>
                </div>
                <div id="tax-fields" style="display:none; margin-top:15px; padding-top:15px; border-top:1px solid var(--border);">
                    <button type="button" class="btn-scan-qr" onclick="openQRScanner()">📷 مسح الباركود الذكي</button>
                    <div class="field">
                        <label>المورد</label>
                        <input type="text" id="sup-name" list="sup-list" oninput="autoVat()" placeholder="اسم المورد...">
                        <datalist id="sup-list"></datalist>
                    </div>
                    <div class="row" style="display:flex; gap:10px; margin-top:10px;">
                        <div style="flex:1;"><label>رقم الفاتورة</label><input type="text" id="sup-inv" placeholder="0000"></div>
                        <div style="flex:1.5;"><label>الرقم الضريبي</label><input type="text" id="sup-vat" placeholder="300..."></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="field" style="margin-bottom:15px;"><label>اسم الحساب</label><select id="acc-name"></select></div>
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <div style="flex:1;"><label>المبلغ شامل</label><input type="number" id="amt" step="0.01" placeholder="0.00"></div>
                    <div style="flex:1;"><label>التاريخ</label><input type="date" id="date"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
const CONFIG = {
    accounts: ["ديزل تبوك","ديزل القريات","صيانة تبوك","صيانة القريات","مياه","كهرباء","مستلزمات مكتبية","مستلزمات مستودع","فاتورة هاتف","ايجار مستودع","ايجار سكن","توصيل بضاعه","اقامات","رحلات","اكراميات","وجبات","مصروفات اخرى","السيارات","محطة الدريس للمحروقات","اشتراك خدمة شهرية محطة الدريس للمحروقات","عمولة البنك لنقاط البيع","سابر","جمارك","البرنامج المحاسبي"],
    vehicles: ["بدون تحديد","سيارة وجية","سيارة نسيم","سيارة سراج","سيارة امين","سيارة سامي","سيارة احمد عيسى","سيارة احمد عادل","سيارة نصر","سيارة محمد انور","فوركلفت"],
    suppliers: [{n:"النور غير بالقريات", v:"301332968800003"}, {n:"مؤسسة امدادات الشمال التجارية", v:"300496999300003"}, {n:"شركة الزوايا المتميزة", v:"311815386200003"}, {n:"الفحص الدوري بالقريات", v:"311145924800003"}]
};

let db = JSON.parse(localStorage.getItem('eagle_v11_db')) || [];
let isTax = false, editId = null;

function init() {
    const aS = document.getElementById('acc-name'); CONFIG.accounts.forEach(a => aS.add(new Option(a, a)));
    const cS = document.getElementById('car-name'); CONFIG.vehicles.forEach(c => cS.add(new Option(c, c)));
    const sL = document.getElementById('sup-list'); CONFIG.suppliers.forEach(s => sL.appendChild(new Option(s.n, s.n)));
    
    const fm = document.getElementById('f-m'); fm.add(new Option("كل الشهور", "all"));
    ["يناير","فبراير","مارس","إبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"].forEach((n,i)=>fm.add(new Option(n, i+1)));
    const fy = document.getElementById('f-y'); for(let y=new Date().getFullYear(); y>=2024; y--) fy.add(new Option(y, y));
    
    document.getElementById('date').valueAsDate = new Date();
    toggleTax(false);
    render();
}

function toggleTax(v) {
    isTax = v;
    document.getElementById('tax-fields').style.display = v ? 'block' : 'none';
    document.getElementById('t-on').className = v ? 'btn btn-outline active-tax' : 'btn btn-outline';
    document.getElementById('t-off').className = !v ? 'btn btn-outline active-tax' : 'btn btn-outline';
}

function autoVat() {
    const val = document.getElementById('sup-name').value;
    const s = CONFIG.suppliers.find(x => x.n === val);
    if(s) document.getElementById('sup-vat').value = s.v;
}

function save() {
    const amt = document.getElementById('amt').value;
    const dV = document.getElementById('date').value;
    if(!amt || !dV) return showToast("⚠️ أكمل البيانات الأساسية");

    const d = new Date(dV);
    const entry = {
        id: editId || Date.now(),
        taxCol: isTax ? "1" : "",
        acc: document.getElementById('acc-name').value,
        amt: parseFloat(amt),
        day: d.getDate(), month: d.getMonth()+1, year: d.getFullYear(), date: dV,
        desc: document.getElementById('desc').value,
        car: document.getElementById('car-name').value,
        odo: document.getElementById('odo').value,
        sup: isTax ? document.getElementById('sup-name').value : "",
        inv: isTax ? document.getElementById('sup-inv').value : "",
        vat: isTax ? document.getElementById('sup-vat').value : ""
    };

    if(editId) { const i = db.findIndex(x => x.id === editId); db[i] = entry; }
    else db.unshift(entry);

    localStorage.setItem('eagle_v11_db', JSON.stringify(db));
    showToast("✅ تم الحفظ بنجاح");
    setTimeout(()=>location.reload(), 800);
}

function render() {
    const m = document.getElementById('f-m').value;
    const y = document.getElementById('f-y').value;
    const filtered = db.filter(e => (m === 'all' || e.month == m) && e.year == y);
    const total = filtered.reduce((s, e) => s + e.amt, 0);
    document.getElementById('stat-bar').innerText = `المجموع: ${total.toFixed(2)} ر.س (${filtered.length} سند)`;

    document.getElementById('list').innerHTML = filtered.map(e => `
        <div class="expense-item">
            <div class="item-head"><span>${e.acc}</span><span>${e.amt.toFixed(2)}</span></div>
            <div style="font-size:12px; color:#64748b; line-height:1.6;">
                📅 ${e.date} | 🚗 ${e.car} ${e.taxCol ? ' | <span style="color:var(--warning)">★ ضريبي</span>' : ''}<br>
                ${e.desc ? `📝 ${e.desc}` : ''}
            </div>
            <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn btn-outline" style="padding:8px; flex:1;" onclick="editItem(${e.id})">✏️ تعديل</button>
                <button class="btn btn-outline" style="padding:8px; flex:1;" onclick="printOnePDF(${e.id})">🖨️ سند</button>
                <button class="btn btn-outline" style="padding:8px; flex:0.3; color:red;" onclick="deleteItem(${e.id})">🗑️</button>
            </div>
        </div>
    `).join('');
}

/* ================== التقارير والطباعة ================== */

// تقرير A4 الشامل المطور
async function printFullA4() {
    const m = document.getElementById('f-m').value;
    const y = document.getElementById('f-y').value;
    const filtered = db.filter(e => (m === 'all' || e.month == m) && e.year == y);
    if(!filtered.length) return alert("لا توجد بيانات");

    const wrap = document.getElementById('print-a4-wrap');
    wrap.style.display = 'block';
    
    let rows = filtered.map((e, i) => `
        <tr>
            <td>${i+1}</td>
            <td>${e.date}</td>
            <td>${e.acc}</td>
            <td>${e.amt.toFixed(2)}</td>
            <td>${e.taxCol ? 'نعم' : 'لا'}</td>
            <td>${e.sup || '-'}</td>
            <td>${e.desc || '-'}</td>
            <td>${e.car || '-'}</td>
        </tr>
    `).join('');

    const total = filtered.reduce((s, e) => s + e.amt, 0);

    wrap.innerHTML = `
        <div class="a4-header">
            <div><h1 style="margin:0;">ايجل للتجارة</h1><p>تقرير المصروفات التفصيلي</p></div>
            <div style="text-align:left;"><p>التاريخ: ${new Date().toLocaleDateString('ar-SA')}</p><p>الفترة: ${m} / ${y}</p></div>
        </div>
        <table class="a4-table">
            <thead>
                <tr>
                    <th>#</th><th>التاريخ</th><th>الحساب</th><th>المبلغ</th><th>ضريبة</th><th>المورد</th><th>الشرح</th><th>السيارة</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>
        <div style="margin-top:20px; text-align:left; font-size:18px;">
            <strong>إجمالي المبلغ: ${total.toFixed(2)} ر.س</strong>
        </div>
    `;

    const opt = { margin: 10, filename: `Eagle_A4_${m}_${y}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } };
    await html2pdf().set(opt).from(wrap).save();
    wrap.style.display = 'none';
}

// التقرير الصغير 58mm
async function printFullPDF() {
    const m = document.getElementById('f-m').value;
    const y = document.getElementById('f-y').value;
    const filtered = db.filter(e => (m === 'all' || e.month == m) && e.year == y);
    if(!filtered.length) return;
    const wrap = document.getElementById('print-wrap'); wrap.style.display = 'block';
    let h = `<div style="text-align:center; border-bottom:1px solid #000; padding-bottom:5px;"><strong>ايجل للتجارة</strong><br>تقرير 58mm</div>`;
    filtered.forEach(e => {
        h += `<div style="border-bottom:1px dashed #ccc; padding:5px 0;">
                <div>${e.acc} | ${e.amt.toFixed(2)}</div>
                <div style="font-size:8px;">${e.date} | ${e.car}</div>
              </div>`;
    });
    wrap.innerHTML = h;
    await html2pdf().set({ margin:0, filename:'Report_58mm.pdf', jsPDF:{unit:'mm', format:[58, 200]} }).from(wrap).save();
    wrap.style.display = 'none';
}

async function printOnePDF(id) {
    const e = db.find(x => x.id === id);
    const wrap = document.getElementById('print-wrap'); wrap.style.display = 'block';
    wrap.innerHTML = `<div style="text-align:center;"><strong>ايجل للتجارة</strong><br>سند مصروف</div>
        <hr><div>التاريخ: ${e.date}</div><div>الحساب: ${e.acc}</div>
        <div style="font-size:20px; margin:10px 0;">المبلغ: ${e.amt.toFixed(2)}</div>
        <hr><div>السيارة: ${e.car}</div><div>المورد: ${e.sup || '-'}</div>`;
    await html2pdf().set({ margin:5, filename:'Receipt.pdf', jsPDF:{unit:'mm', format:[58, 100]} }).from(wrap).save();
    wrap.style.display = 'none';
}

/* ================== وظيفة QR والتمييز بالأحمر ================== */

let qrStream = null;
async function openQRScanner() {
    document.getElementById('modal-qr').classList.add('active');
}

function closeQRScanner() {
    if(qrStream) qrStream.getTracks().forEach(t => t.stop());
    document.getElementById('modal-qr').classList.remove('active');
}

async function toggleQRCamera() {
    try {
        qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        const video = document.getElementById('qr-video');
        video.srcObject = qrStream;
        video.play();
        requestAnimationFrame(tick);
    } catch(err) { alert("خطأ في الكاميرا"); }
}

function tick() {
    const video = document.getElementById('qr-video');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code) { handleQR(code.data); return; }
    }
    if(document.getElementById('modal-qr').classList.contains('active')) requestAnimationFrame(tick);
}

// تحليل بيانات ZATCA TLV
function parseZatca(text) {
    try {
        const bin = atob(text);
        const bytes = new Uint8Array(bin.length);
        for (let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
        let i = 0, tags = {};
        while(i < bytes.length) {
            let t = bytes[i], l = bytes[i+1], v = new TextDecoder().decode(bytes.slice(i+2, i+2+l));
            tags[t] = v; i += 2+l;
        }
        return tags;
    } catch(e) { return null; }
}

function handleQR(text) {
    const tags = parseZatca(text);
    if(tags) {
        toggleTax(true);
        if(tags[1]) document.getElementById('sup-name').value = tags[1];
        if(tags[2]) document.getElementById('sup-vat').value = tags[2];
        if(tags[4]) document.getElementById('amt').value = tags[4];
        
        // تمييز الخانات المطلوبة باللون الأحمر
        highlightFields(['sup-inv', 'acc-name', 'desc']);
        
        showToast("✅ تم المسح.. يرجى إكمال الخانات المحددة");
        closeQRScanner();
    }
}

function highlightFields(ids) {
    ids.forEach(id => {
        const el = document.getElementById(id);
        el.classList.add('required-alert');
        // إزالة التنبيه عند بدء الكتابة
        el.oninput = () => el.classList.remove('required-alert');
        el.onchange = () => el.classList.remove('required-alert');
    });
}

/* ================== أدوات مساعدة ================== */
function tab(t) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('view-'+t).classList.add('active');
    document.getElementById('nav-'+t).classList.add('active');
    if(t === 'records') render();
}

function editItem(id) {
    const e = db.find(x => x.id === id); editId = id; tab('entry');
    toggleTax(!!e.taxCol);
    document.getElementById('acc-name').value = e.acc; document.getElementById('amt').value = e.amt;
    document.getElementById('date').value = e.date; document.getElementById('desc').value = e.desc;
    document.getElementById('car-name').value = e.car; document.getElementById('odo').value = e.odo;
    document.getElementById('sup-name').value = e.sup; document.getElementById('sup-inv').value = e.inv;
    document.getElementById('sup-vat').value = e.vat;
    document.getElementById('save-btn').innerText = "🔄 تحديث السند";
}

function deleteItem(id) { if(confirm("حذف هذا السند؟")) { db = db.filter(x => x.id !== id); localStorage.setItem('eagle_v11_db', JSON.stringify(db)); render(); } }

function exportExcel() {
    const ws = XLSX.utils.json_to_sheet(db); const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Expenses"); XLSX.writeFile(wb, "Eagle_Data.xlsx");
}

function startVoice() {
    const S = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!S) return; const r = new S(); r.lang = 'ar-SA';
    r.onresult = (e) => document.getElementById('desc').value += e.results[0][0].transcript;
    r.start();
}

function showToast(m) {
    const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

function purgeStep1() { if(confirm("سيتم مسح كل البيانات نهائياً! هل أنت متأكد؟")) { db = []; localStorage.removeItem('eagle_v11_db'); location.reload(); } }

init();
</script>
</body>
</html>
