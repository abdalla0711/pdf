    const input = document.getElementById('codeInput');
    const resultsContainer = document.getElementById('resultsContainer');
    const notFound = document.getElementById('notFound');

    input.addEventListener('input', () => {
      const query = input.value.trim().toUpperCase();

      // Filter customers based on partial match of the code
      const filteredCustomers = Object.entries(customers)
        .filter(([code, customer]) => code.includes(query))
        .map(([code, customer]) => ({ code, ...customer }));

      // Clear previous results
      resultsContainer.innerHTML = '';

      if (filteredCustomers.length > 0) {
        // Display customer names only
        filteredCustomers.forEach(customer => {
          const customerDiv = document.createElement('div');
          customerDiv.classList.add('result-item');
          customerDiv.textContent = customer.name; // Only show the name
          resultsContainer.appendChild(customerDiv);
        });
        notFound.style.display = 'none';
      } else {
        notFound.style.display = 'block';
