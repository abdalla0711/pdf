<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حاسبة الخصومات التفصيلية | الإصدار المحترف</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary-color: #2563eb;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); padding: 15px; margin: 0; direction: rtl; }
        .container { max-width: 650px; margin: 0 auto; }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h2 { text-align: center; color: var(--primary-color); margin-top: 0; }

        .section-title {
            font-weight: bold;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 15px;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #475569;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; font-weight: 600; color: #475569; }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
        }

        /* رقم الفاتورة */
        .invoice-wrapper {
            display: flex; align-items: center; direction: ltr;
            background: #f8fafc; border: 2px solid var(--border-color);
            border-radius: 8px; overflow: hidden;
        }
        .invoice-prefix { padding: 10px; background: #e2e8f0; font-weight: bold; color: #1e293b; }
        .invoice-wrapper input { border: none; text-align: center; background: transparent; }
        #invP1 { width: 50px; border-right: 1px solid #cbd5e1 !important; font-weight: bold; color: var(--primary-color); }
        #invP2 { flex: 1; }

        .btn-add {
            background: var(--success-color); color: white; border: none;
            padding: 12px; border-radius: 8px; cursor: pointer;
            width: 100%; font-weight: bold; margin-bottom: 20px;
        }

        .item-card {
            border: 1px solid #cbd5e1; padding: 15px; border-radius: 10px;
            margin-bottom: 15px; background: #fdfdfd;
        }

        .disabled-section { opacity: 0.5; pointer-events: none; filter: grayscale(0.8); background-color: #f8fafc; }

        .results-box { background: #1e293b; color: white; padding: 20px; border-radius: 12px; }
        .res-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .res-total { border-top: 1px solid #475569; padding-top: 10px; font-size: 1.25rem; color: var(--success-color); font-weight: bold; }

        #copyBtn {
            width: 100%; background: var(--primary-color); color: white;
            border: none; padding: 16px; border-radius: 8px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 15px;
        }

        .hidden { display: none; }
        .flex-row { display: flex; gap: 10px; align-items: flex-end; }
        .flex-item { flex: 1; }
        .tax-check { width: auto; margin-left: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة الخصومات المتقدمة</h2>

    <div class="card">
        <div class="section-title">بيانات الفاتورة والعميل</div>
        <div class="form-group">
            <label>بحث باسم العميل</label>
            <input type="text" id="customerName" list="customerNamesList" placeholder="اكتب اسم العميل..." oninput="onNameInput()">
            <datalist id="customerNamesList"></datalist>
        </div>

        <div class="row" style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px;">
            <div class="form-group">
                <label>كود العميل</label>
                <input type="text" id="customerCode" placeholder="20XXX" oninput="onCodeInput()">
            </div>
            <div class="form-group">
                <label>رقم الفاتورة (wh0X - XXXXX)</label>
                <div class="invoice-wrapper">
                    <span class="invoice-prefix">wh0</span>
                    <input type="number" id="invP1" placeholder="4" oninput="this.value=this.value.slice(0,1)">
                    <span class="invoice-sep" style="font-weight:bold; padding:0 5px;">-</span>
                    <input type="number" id="invP2" placeholder="10251">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>إجمالي الفاتورة (بالضريبة)</label>
            <input type="number" id="mainInvoiceAmount" oninput="calculateAll()" placeholder="0.00">
        </div>
    </div>

    <div class="section-title">خصومات الأصناف</div>
    <div id="itemsContainer"></div>
    <button class="btn-add" onclick="addItemRow()">+ إضافة صنف مخصوم جديد</button>

    <div class="card">
        <div class="section-title">
            <span>الخصم النقدي (30 يوم)</span>
            <div style="display: flex; align-items: center; font-size: 0.8rem;">
                تنشيط <input type="checkbox" id="cashToggle" onchange="toggleCashSection(); calculateAll()" style="width: 20px; height: 20px; margin-right: 8px;">
            </div>
        </div>
        <div id="cashContent" class="disabled-section" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label>نسبة الخصم النقدي %</label>
                <input type="number" id="cashPercent" value="2" oninput="calculateAll()">
            </div>
            <div class="form-group" style="display: flex; align-items: center; padding-top: 25px;">
                <input type="checkbox" id="cashTaxToggle" checked onchange="calculateAll()" class="tax-check">
                <label style="margin-bottom: 0; cursor: pointer;">شامل الضريبة</label>
            </div>
        </div>
    </div>

    <div class="results-box">
        <div class="res-row"><span>إجمالي خصم الأصناف:</span> <span id="outItemTotal">0.00</span></div>
        <div class="res-row"><span>خصم السداد:</span> <span id="outCashTotal">0.00</span></div>
        <div class="res-row res-total"><span>الصافي المطلوب:</span> <span id="outFinal">0.00</span></div>
    </div>

    <button id="copyBtn" onclick="copyToClipboard()">نسخ التقرير التفصيلي</button>
</div>

    const customers = rawCustomerData.trim().split('\n').map(line => {
        const dash = line.indexOf('-');
        return { id: line.substring(0, dash).trim(), name: line.substring(dash + 1).trim() };
    }).filter(c => c.id && c.name);

    const datalist = document.getElementById('customerNamesList');
    customers.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.name;
        datalist.appendChild(opt);
    });

    function onNameInput() {
        const found = customers.find(c => c.name === document.getElementById('customerName').value);
        if (found) document.getElementById('customerCode').value = found.id;
    }

    function onCodeInput() {
        const found = customers.find(c => c.id === document.getElementById('customerCode').value);
        if (found) document.getElementById('customerName').value = found.name;
    }

    const TAX_RATE = 0.15;
    let itemCount = 0;

    function addItemRow() {
        itemCount++;
        const div = document.createElement('div');
        div.className = 'item-card';
        div.id = `itemRow_${itemCount}`;
        div.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <label style="color: var(--primary-color);">الصنف (${itemCount})</label>
                <button style="background:var(--danger-color); color:white; border:none; border-radius:5px; padding:5px 10px; cursor:pointer;" onclick="removeItemRow(${itemCount})">حذف</button>
            </div>
            <select class="item-type" style="margin-bottom:12px" onchange="toggleOther(${itemCount}); calculateAll()">
                <option value="600">600</option>
                <option value="فوط نسائية">فوط نسائية</option>
                <option value="حفائض">حفائض</option>
                <option value="أخرى">أخرى</option>
            </select>
            <input type="text" id="other_${itemCount}" class="other-name hidden" placeholder="اسم الصنف..." style="margin-bottom:12px">
            <div class="flex-row">
                <div class="flex-item"><label>قيمة الصنف</label><input type="number" class="item-value" oninput="calculateAll()"></div>
                <div class="flex-item"><label>الخصم %</label><input type="number" class="item-percent" value="3" oninput="calculateAll()"></div>
                <div style="padding-bottom:10px; display:flex; align-items:center;">
                    <input type="checkbox" class="item-tax-toggle tax-check" checked onchange="calculateAll()" id="tax_${itemCount}">
                    <label for="tax_${itemCount}" style="font-size:0.7rem; margin:0;">بالضريبة</label>
                </div>
            </div>
        `;
        document.getElementById('itemsContainer').appendChild(div);
    }

    function removeItemRow(id) { document.getElementById(`itemRow_${id}`).remove(); calculateAll(); }
    function toggleOther(id) { document.getElementById(`other_${id}`).classList.toggle('hidden', document.querySelector(`#itemRow_${id} .item-type`).value !== 'أخرى'); }
    function toggleCashSection() { document.getElementById('cashContent').classList.toggle('disabled-section', !document.getElementById('cashToggle').checked); }
    function formatNum(n) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    function calculateAll() {
        const totalInvoice = parseFloat(document.getElementById('mainInvoiceAmount').value) || 0;
        let totalItemsDisc = 0;

        document.querySelectorAll('.item-card').forEach(row => {
            const val = parseFloat(row.querySelector('.item-value').value) || 0;
            const per = parseFloat(row.querySelector('.item-percent').value) || 0;
            const isTaxed = row.querySelector('.item-tax-toggle').checked;
            const base = isTaxed ? val : val / (1 + TAX_RATE);
            totalItemsDisc += base * (per / 100);
        });

        let cashDisc = 0;
        if (document.getElementById('cashToggle').checked) {
            const rem = totalInvoice - totalItemsDisc;
            const per = parseFloat(document.getElementById('cashPercent').value) || 0;
            const isTaxed = document.getElementById('cashTaxToggle').checked;
            cashDisc = (isTaxed ? rem : rem / (1 + TAX_RATE)) * (per / 100);
        }

        document.getElementById('outItemTotal').innerText = formatNum(totalItemsDisc);
        document.getElementById('outCashTotal').innerText = formatNum(cashDisc);
        document.getElementById('outFinal').innerText = formatNum(totalInvoice - totalItemsDisc - cashDisc);
        return { totalInvoice, totalItemsDisc, cashDisc, final: totalInvoice - totalItemsDisc - cashDisc };
    }

    function copyToClipboard() {
        const p1 = document.getElementById('invP1').value.trim();
        const p2 = document.getElementById('invP2').value.trim();
        if (p1.length !== 1 || p2.length < 4 || p2.length > 5) { alert("تأكد من صحة رقم الفاتورة (wh0X-XXXXX)"); return; }

        const res = calculateAll();
        const fullInv = `wh0${p1}-${p2}`;
        let report = `📄 *تقرير الخصومات التفصيلي*\n━━━━━━━━━━━━━━\n`;
        report += `👤 العميل: ${document.getElementById('customerName').value || 'غير محدد'}\n`;
        report += `🆔 الكود: ${document.getElementById('customerCode').value || '-'}\n`;
        report += `🧾 فاتورة: ${fullInv}\n`;
        report += `💰 إجمالي الفاتورة: ${formatNum(res.totalInvoice)} ر.س\n\n`;

        const items = document.querySelectorAll('.item-card');
        if (items.length > 0) {
            report += `🏷️ *تفاصيل الأصناف المخصومة:*\n`;
            items.forEach((row) => {
                let type = row.querySelector('.item-type').value;
                if (type === 'أخرى') type = row.querySelector('.other-name').value || 'صنف مخصص';
                const val = parseFloat(row.querySelector('.item-value').value) || 0;
                const per = parseFloat(row.querySelector('.item-percent').value) || 0;
                const isTaxed = row.querySelector('.item-tax-toggle').checked;
                const base = isTaxed ? val : val / (1 + TAX_RATE);
                const discVal = base * (per / 100);
                
                report += `- ${type}:\n`;
                report += `  قيمة الصنف: ${formatNum(val)} ر.س (${isTaxed ? "شامل الضريبة" : "قبل الضريبة"})\n`;
                report += `  الخصم (${per}%): ${formatNum(discVal)} ر.س\n`;
            });
            report += ` مجموع خصم الأصناف: ${formatNum(res.totalItemsDisc)} ر.س\n\n`;
        }

        if (document.getElementById('cashToggle').checked) {
            report += `💸 *الخصم النقدي (30 يوم):*\n`;
            report += `- القيمة الصافية بعد خصم الأصناف: ${formatNum(res.totalInvoice - res.totalItemsDisc)} ر.س\n`;
            report += `- الخصم (${document.getElementById('cashPercent').value}%): ${formatNum(res.cashDisc)} ر.س\n\n`;
        }

        report += `━━━━━━━━━━━━━━\n`;
        report += `📉 إجمالي الخصومات: ${formatNum(res.totalItemsDisc + res.cashDisc)} ر.س\n`;
        report += `✅ *المبلغ الصافي للتحصيل: ${formatNum(res.final)} ر.س*\n\n`;
        report += `${fullInv}`;

        navigator.clipboard.writeText(report).then(() => alert("✅ تم نسخ التقرير التفصيلي بنجاح!"));
    }
