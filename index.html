<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محرر PDF الاحترافي</title>
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

    <style>
        @font-face {
            font-family: 'CustomArabic';
            src: url('https://files.catbox.moe/hmey7o.ttf');
        }

        :root {
            --primary: #4834d4; --accent: #686de0; --success: #2ecc71; --danger: #eb4d4b;
            --bg: #f5f6fa; --card: #ffffff; --text: #2f3640;
        }
        body { font-family: 'CustomArabic', 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { background: var(--card); width: 100%; max-width: 600px; padding: 20px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); box-sizing: border-box; }
        h1 { text-align: center; font-size: 1.3rem; margin-bottom: 20px; color: var(--primary); }
        
        .compression-section { background: #fff9e6; border: 1px solid #ffeaa7; padding: 12px; border-radius: 15px; margin-bottom: 15px; }
        .compression-info { display: flex; justify-content: space-between; font-size: 0.75rem; margin-top: 5px; font-weight: bold; color: #856404; }

        .upload-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .upload-section { border: 2px dashed #dcdde1; padding: 15px; border-radius: 18px; text-align: center; cursor: pointer; background: #fafafa; flex: 1; font-weight: bold; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; }
        .btn-camera { background: var(--primary); color: white; border: none; border-radius: 18px; padding: 0 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }

        .btn { border: none; border-radius: 12px; padding: 12px; font-size: 0.95rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; color: white; width: 100%; font-family: 'CustomArabic', sans-serif; }
        .btn-gps { background: var(--accent); margin-bottom: 10px; }
        .btn-merge { background: var(--success); }
        .btn-images { background: #f39c12; }

        #fileList { margin-top: 15px; width: 100%; }
        .file-item { background: #fff; margin-bottom: 10px; padding: 12px; border-radius: 16px; border: 1px solid #edf2f7; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .drag-handle { cursor: grab; color: #ccc; font-size: 1.4rem; }
        .thumb-wrapper { width: 55px; height: 55px; border-radius: 8px; overflow: hidden; border: 1px solid #eee; background: #f9f9f9; flex-shrink: 0; cursor: pointer; }
        .thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .item-content-stack { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .page-name-input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.85rem; outline: none; box-sizing: border-box; font-family: 'CustomArabic', sans-serif; }
        
        .item-controls-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .checkbox-group { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: bold; color: var(--primary); }
        .btns-row { display: flex; gap: 6px; }
        .btn-icon { background: #f1f2f6; border: none; cursor: pointer; font-size: 0.95rem; padding: 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 500px; padding: 20px; border-radius: 20px; text-align: center; }
        
        #previewBox { width: 100%; max-height: 60vh; overflow-y: auto; margin-top: 10px; border-radius: 10px; background: #eee; }
        #previewBox img { width: 100%; height: auto; display: block; margin: 0 auto; }

        .main-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; width: 100%; }
        .loading { display: none; text-align: center; color: var(--primary); font-weight: bold; padding: 10px; font-size: 0.9rem; }
        textarea, input { font-family: 'CustomArabic', sans-serif; }
    </style>
</head>
<body>

<div class="container">
    <h1>محرر PDF الاحترافي</h1>

    <div class="compression-section">
        <label style="font-weight: bold; font-size: 0.85rem;">🗜️ جودة ضغط الصور (لتقليل الحجم):</label>
        <input type="range" id="compressionQuality" min="0.1" max="1.0" step="0.1" value="0.7" style="width: 100%; margin-top: 8px;">
        <div class="compression-info">
            <span>حجم أصغر</span>
            <span>جودة أعلى</span>
        </div>
    </div>

    <div class="upload-container">
        <div class="upload-section" onclick="document.getElementById('fileInput').click()">
            <span>📂 إضافة PDF أو صور</span>
            <input type="file" id="fileInput" multiple accept="image/*,application/pdf" style="display:none">
        </div>
        <button class="btn-camera" onclick="document.getElementById('cameraInput').click()">📸 تصوير</button>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
    </div>

    <button class="btn btn-gps" onclick="startGPS()">📍 إضافة صفحة الموقع (GPS)</button>

    <div style="background: #f9f9f9; padding: 12px; border-radius: 15px; border: 1px solid #eee; margin-bottom:15px;">
        <textarea id="textPageInput" rows="2" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd; outline:none; font-family:inherit; resize: none;" placeholder="اكتب نصاً ليظهر في صفحة مستقلة..."></textarea>
        <button class="btn" style="background:var(--primary); margin-top:8px; height:36px; font-size:0.85rem;" onclick="handleTextAddition()">إدراج نص</button>
    </div>

    <input type="text" id="fileNameInput" placeholder="اسم الملف النهائي..." value="merged_document" style="width:100%; padding:10px; border-radius:10px; border:1px solid #eee; box-sizing:border-box; outline:none;">

    <div id="fileList"></div>

    <div id="status" class="loading">جاري المعالجة...</div>

    <div class="main-actions">
        <button id="imgBtn" class="btn btn-images" onclick="saveAsImages()" disabled>🖼️ حفظ كصور</button>
        <button id="mergeBtn" class="btn btn-merge" onclick="mergeAll()" disabled>🚀 حفظ ملف PDF</button>
    </div>
</div>

<a href="new_customer.html" style="background: #2f3542; color: white; width: 100%; max-width: 600px; margin-top: 15px; text-decoration: none; text-align: center; display: block; border-radius: 12px; padding: 12px; font-weight: bold; font-size: 0.9rem;">New Customer</a>

<div id="previewOverlay" class="modal-overlay">
    <div class="modal-content">
        <h3>معاينة الصفحة</h3>
        <div id="previewBox"></div>
        <button class="btn" style="background:var(--danger); margin-top:15px;" onclick="document.getElementById('previewOverlay').style.display='none'">إغلاق</button>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let items = [];
    const FONT_URL = 'https://files.catbox.moe/hmey7o.ttf';

    function updateItemData(idx, field, value) { items[idx][field] = value; }

    function renderUI() {
        const list = document.getElementById('fileList');
        list.innerHTML = '';
        items.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.dataset.id = item.id;
            div.innerHTML = `
                <div class="drag-handle">☰</div>
                <div class="thumb-wrapper" onclick="showPreview(${idx})"><img src="${item.thumb}" style="transform: rotate(${item.rotation}deg)"></div>
                <div class="item-content-stack">
                    <input type="text" class="page-name-input" placeholder="عنوان الصفحة..." value="${item.customName}" oninput="updateItemData(${idx}, 'customName', this.value)">
                    <div class="item-controls-row">
                        <div class="checkbox-group">
                            <input type="checkbox" ${item.includeName ? 'checked' : ''} onchange="updateItemData(${idx}, 'includeName', this.checked)">
                            <span>تضمين العنوان</span>
                        </div>
                        <div class="btns-row">
                            <button class="btn-icon" onclick="showPreview(${idx})">👁️</button>
                            <button class="btn-icon" onclick="rotateItem(${idx})">🔄</button>
                            <button class="btn-icon" onclick="removeItem(${idx})">🗑️</button>
                        </div>
                    </div>
                </div>
            `;
            list.appendChild(div);
        });
        const hasItems = items.length > 0;
        document.getElementById('mergeBtn').disabled = !hasItems;
        document.getElementById('imgBtn').disabled = !hasItems;
    }

    Sortable.create(document.getElementById('fileList'), {
        animation: 150, handle: '.drag-handle',
        onEnd: function() {
            const newOrder = [];
            document.querySelectorAll('.file-item').forEach(el => {
                const item = items.find(i => i.id == el.dataset.id);
                if (item) newOrder.push(item);
            });
            items = newOrder; renderUI();
        }
    });

    const handleFiles = async (e) => {
        const files = Array.from(e.target.files);
        for (const file of files) {
            const suggestedName = file.name.replace(/\.[^/.]+$/, ""); // استخراج اسم الملف
            
            if (file.type === 'application/pdf') {
                const buffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({data: buffer.slice(0)}).promise;
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({scale: 0.3});
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.height = viewport.height; canvas.width = viewport.width;
                    await page.render({canvasContext: ctx, viewport: viewport}).promise;
                    items.push({ 
                        id: Math.random(), type: 'pdf', customName: suggestedName, 
                        pageIdx: i-1, data: buffer, thumb: canvas.toDataURL(), 
                        rotation: 0, includeName: false 
                    });
                }
            } else if (file.type.startsWith('image/')) {
                items.push({ 
                    id: Math.random(), type: 'image', customName: suggestedName, 
                    file: file, thumb: URL.createObjectURL(file), 
                    rotation: 0, includeName: false 
                });
            }
        }
        renderUI(); e.target.value = '';
    };

    document.getElementById('fileInput').addEventListener('change', handleFiles);
    document.getElementById('cameraInput').addEventListener('change', handleFiles);

    async function mergeAll() {
        const status = document.getElementById('status'); status.style.display = 'block';
        status.textContent = "جاري تحميل الخط ومعالجة الصفحات...";
        
        try {
            const { PDFDocument, rgb, degrees } = PDFLib;
            const pdfDoc = await PDFDocument.create();
            pdfDoc.registerFontkit(fontkit);
            
            // تحميل الخط العربي
            const fontBytes = await fetch(FONT_URL).then(res => res.arrayBuffer());
            const customFont = await pdfDoc.embedFont(fontBytes);
            const quality = parseFloat(document.getElementById('compressionQuality').value);

            for (const item of items) {
                if (item.type === 'pdf') {
                    const srcDoc = await PDFDocument.load(item.data);
                    const [copiedPage] = await pdfDoc.copyPages(srcDoc, [item.pageIdx]);
                    if(item.rotation !== 0) copiedPage.setRotation(degrees(item.rotation));
                    
                    if (item.includeName && item.customName) {
                        drawArabicText(copiedPage, item.customName, customFont, 18);
                    }
                    pdfDoc.addPage(copiedPage);
                } else if (item.type === 'image') {
                    const canvas = await getProcessedCanvas(item, quality);
                    const imgBytes = await fetch(canvas.toDataURL('image/jpeg', quality)).then(r => r.arrayBuffer());
                    const pdfImg = await pdfDoc.embedJpg(imgBytes);
                    const page = pdfDoc.addPage([canvas.width * 0.75, canvas.height * 0.75]);
                    page.drawImage(pdfImg, { x: 0, y: 0, width: page.getWidth(), height: page.getHeight() });
                    
                    if (item.includeName && item.customName) {
                        drawArabicText(page, item.customName, customFont, 18);
                    }
                } else {
                    // صفحات النص و GPS (نصوص قابلة للتحديد)
                    const page = pdfDoc.addPage([595, 842]); // A4
                    const content = item.type === 'gps' ? item.content : item.text;
                    const lines = content.split('\n');
                    
                    let yOffset = 800;
                    if (item.customName) {
                        drawArabicText(page, item.customName, customFont, 22, 780);
                        yOffset -= 50;
                    }

                    lines.forEach(line => {
                        page.drawText(line, {
                            x: 50,
                            y: yOffset,
                            size: 14,
                            font: customFont,
                            color: rgb(0, 0, 0)
                        });
                        yOffset -= 25;
                    });
                }
            }

            const pdfBytes = await pdfDoc.save();
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([pdfBytes], { type: "application/pdf" }));
            link.download = document.getElementById('fileNameInput').value + ".pdf";
            link.click();
            status.textContent = "✅ تم الحفظ بنجاح!"; setTimeout(() => status.style.display = 'none', 3000);
        } catch (e) { 
            console.error(e);
            alert("حدث خطأ: " + e.message); 
            status.style.display = 'none'; 
        }
    }

    // دالة مساعدة لرسم النص العربي (تتعامل مع التموضع البسيط)
    function drawArabicText(page, text, font, size, customY) {
        const { width, height } = page.getSize();
        const textWidth = font.widthOfTextAtSize(text, size);
        page.drawText(text, {
            x: width - textWidth - 30, // محاذاة لليمين
            y: customY || (height - size - 20),
            size: size,
            font: font,
            color: PDFLib.rgb(0.28, 0.2, 0.83) // لون Primary
        });
    }

    async function getProcessedCanvas(item, quality) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image(); 
        img.src = item.type === 'image' ? URL.createObjectURL(item.file) : item.thumb;
        await new Promise(r => img.onload = r);
        canvas.width = img.width; canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        return canvas;
    }

    async function handleTextAddition() {
        const text = document.getElementById('textPageInput').value.trim();
        if (!text) return;
        items.push({ 
            id: Math.random(), type: 'text_page', 
            customName: "صفحة نصية", text: text, 
            thumb: await genSimpleThumb("📄 نص"), rotation: 0, includeName: true 
        });
        document.getElementById('textPageInput').value = ''; renderUI();
    }

    function startGPS() {
        navigator.geolocation.getCurrentPosition((pos) => {
            const lat = pos.coords.latitude.toFixed(6);
            const lon = pos.coords.longitude.toFixed(6);
            const c = `بيانات الموقع الجغرافي\nخط العرض: ${lat}\nخط الطول: ${lon}\nرابط خرائط جوجل:\nhttps://www.google.com/maps?q=${lat},${lon}`;
            items.push({ id: Math.random(), type: 'gps', customName: "موقع GPS", content: c, rotation: 0, thumb: "", includeName: true });
            const last = items[items.length-1];
            genSimpleThumb("📍 GPS").then(t => { last.thumb = t; renderUI(); });
        }, () => alert("يرجى تفعيل صلاحية الوصول للموقع"));
    }

    async function showPreview(idx) {
        const item = items[idx];
        const overlay = document.getElementById('previewOverlay');
        const previewBox = document.getElementById('previewBox');
        overlay.style.display = 'flex';
        previewBox.innerHTML = '<p style="padding:20px">جاري تحميل المعاينة...</p>';

        let url = "";
        if (item.type === 'pdf') {
            const pdf = await pdfjsLib.getDocument({data: item.data.slice(0)}).promise;
            const page = await pdf.getPage(item.pageIdx + 1);
            const viewport = page.getViewport({scale: 1.0});
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.height = viewport.height; canvas.width = viewport.width;
            await page.render({canvasContext: ctx, viewport: viewport}).promise;
            url = canvas.toDataURL();
        } else if (item.type === 'image') {
            url = URL.createObjectURL(item.file);
        } else {
            const canvas = document.createElement('canvas');
            canvas.width = 400; canvas.height = 500;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white'; ctx.fillRect(0,0,400,500);
            ctx.fillStyle = 'black'; ctx.font = '16px CustomArabic';
            const content = item.type === 'gps' ? item.content : item.text;
            content.split('\n').forEach((l, i) => ctx.fillText(l, 20, 40+(i*25)));
            url = canvas.toDataURL();
        }
        previewBox.innerHTML = `<img src="${url}" style="transform: rotate(${item.rotation}deg); max-width:100%">`;
    }

    async function saveAsImages() {
        const q = parseFloat(document.getElementById('compressionQuality').value);
        for (let i = 0; i < items.length; i++) {
            const canvas = await getProcessedCanvas(items[i], q);
            const link = document.createElement("a");
            link.href = canvas.toDataURL('image/jpeg', q);
            link.download = (items[i].customName || `page_${i+1}`) + ".jpg";
            link.click();
            await new Promise(r => setTimeout(r, 300));
        }
    }

    function rotateItem(i) { items[i].rotation = (items[i].rotation + 90) % 360; renderUI(); }
    function removeItem(i) { items.splice(i, 1); renderUI(); }
    async function genSimpleThumb(t) { 
        const canvas = document.createElement('canvas'); canvas.width = 100; canvas.height = 100;
        const ctx = canvas.getContext('2d'); ctx.fillStyle = '#eee'; ctx.fillRect(0,0,100,100);
        ctx.fillStyle = '#333'; ctx.font = '14px CustomArabic'; ctx.textAlign = 'center'; ctx.fillText(t, 50, 55);
        return canvas.toDataURL();
    }
</script>
</body>
</html>
