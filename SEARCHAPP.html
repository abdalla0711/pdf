<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام متابعة مؤسسة ايجل - النسخة التلقائية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --bg: #f4f7fa; --primary: #1e293b; --blue: #2563eb; --green: #10b981; --red: #ef4444; --yellow: #f59e0b; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #1e293b; }
        .container { max-width: 1500px; margin: 0 auto; }
        
        .header-card { background: var(--white); padding: 15px 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        /* حالة الملفات */
        .file-status-bar { display: flex; gap: 15px; margin-bottom: 15px; font-size: 11px; }
        .status-pill { padding: 4px 10px; border-radius: 20px; background: #e2e8f0; color: #64748b; font-weight: bold; border: 1px solid #cbd5e0; }
        .status-pill.success { background: #dcfce7; color: #166534; border-color: #bbf7d0; }

        .search-area { display: flex; gap: 10px; align-items: center; }
        .search-area input { flex: 1; padding: 12px 18px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 16px; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .search-area input:focus { border-color: var(--blue); }
        
        .btn { padding: 10px 25px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; transition: 0.2s; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-toggle { background: #64748b; color: white; }

        /* تاريخ البيانات */
        .data-date-info { font-size: 12px; color: #64748b; margin-top: 5px; font-weight: bold; }

        #reportHeader { display: none; background: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 15px; border-right: 6px solid var(--blue); justify-content: space-between; align-items: center; }
        .blur-effect { filter: blur(8px); }
        .eye-btn { background: #f1f5f9; border: none; padding: 6px; border-radius: 50%; cursor: pointer; font-size: 18px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .stat-card { background: var(--white); padding: 15px; border-radius: 12px; border-right: 4px solid var(--blue); }
        .stat-card h3 { margin: 0; font-size: 11px; color: #94a3b8; }
        .stat-card p { margin: 8px 0 0; font-size: 18px; font-weight: 800; }

        .table-container { background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        thead { background: var(--primary); color: white; }
        th { padding: 10px; text-align: right; font-size: 12px; position: sticky; top: 0; z-index: 10; }
        
        .inv-row td { padding: 8px 10px; font-size: 12px; border-bottom: 1px solid #f1f5f9; }
        .inv-row { background: #fbfcfd; font-weight: 600; }
        .details-row.hidden { display: none; }
        .overdue { color: var(--red) !important; font-weight: 900 !important; }

        .payment-box { background: #fff; border: 1px solid #f1f5f9; border-right: 3px solid var(--green); margin: 3px 40px; padding: 5px 15px; border-radius: 6px; display: flex; justify-content: space-between; font-size: 11px; }
        .box-discount { border-right-color: var(--yellow); background: #fffdf5; }
        .tag { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; display: inline-block; }
        .tag-cash { background: #dcfce7; color: #166534; }

        #customerList { display: none; background: white; margin-top: 10px; border-radius: 12px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); padding: 10px; }
        .cust-item { padding: 8px; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body onload="autoLoadServerFiles()">

<div class="container">
    <div class="header-card">
        <div class="file-status-bar">
            <div id="statusSales" class="status-pill">المبيعات: جاري البحث...</div>
            <div id="statusCol" class="status-pill">التحصيل: جاري البحث...</div>
            <div id="statusCust" class="status-pill">العملاء: جاري البحث...</div>
        </div>
        
        <div class="search-area">
            <input type="text" id="query" placeholder="أدخل اسم العميل أو الرمز للبحث في البيانات المحملة...">
            <button class="btn btn-blue" onclick="searchCustomers()">بحث وتدقيق</button>
            <button class="btn btn-toggle" id="toggleBtn" onclick="toggleAllDetails()" style="display:none">إخفاء السندات</button>
        </div>
        <div id="lastUpdateInfo" class="data-date-info"></div>
        <div id="customerList"></div>
    </div>

    <div id="reportHeader">
        <div>
            <button class="eye-btn" onclick="toggleBlur()">👁️</button>
            <span id="displayClientName" style="font-size:19px; font-weight:800"></span>
            <span id="displayClientCode" style="color:#64748b; font-size:13px; margin-right:10px"></span>
        </div>
        <div style="font-size:11px; color:#94a3b8">تحليل مالي مباشر</div>
    </div>

    <div id="stats" class="stats-grid" style="display:none">
        <div class="stat-card"><h3>إجمالي مبيعات الصافي</h3><p id="statPurchases">0</p></div>
        <div class="stat-card"><h3>أقصى عمر دين (يوم)</h3><p id="statMaxDays">0</p></div>
        <div class="stat-card"><h3>متوسط السداد الشهري</h3><p id="statLimit">0</p></div>
    </div>

    <div class="table-container" id="resultsArea" style="display:none">
        <table>
            <thead>
                <tr>
                    <th style="width: 14%;">الفاتورة / التاريخ</th>
                    <th style="width: 10%;">المبلغ الأصلي</th>
                    <th style="width: 18%;">المرتجع والخصومات</th>
                    <th style="width: 10%;">الصافي المطلوب</th>
                    <th style="width: 10%;">المسدد</th>
                    <th style="width: 10%;">المتبقي</th>
                    <th style="width: 8%;">السندات</th>
                    <th style="width: 10%;">نوع السداد</th>
                    <th style="width: 10%;">عمر الدين</th>
                </tr>
            </thead>
            <tbody id="mainBody"></tbody>
        </table>
    </div>
</div>

<script>
    let db = { sales: [], col: {}, cust: [] };
    let detailsVisible = true;
    
    // إعدادات البحث التلقائي عن الملفات
    const fileConfig = [
        { key: 'sales', prefix: 'Report_SalesInvoiceListing_', skip: 3, statusId: 'statusSales' },
        { key: 'col', prefix: 'Report_SalesCollectionListing_', skip: 3, statusId: 'statusCol' },
        { key: 'cust', prefix: 'Report_InventoryCustomerListing_', skip: 2, statusId: 'statusCust' }
    ];

    // دالة محاكاة لجلب الملفات تلقائياً (تتطلب تشغيل الملف عبر سيرفر)
    async function autoLoadServerFiles() {
        // بما أن الأسماء متغيرة، سنقوم بمحاولة جلب قائمة الملفات أو الطلب من المستخدم توحيد الأسماء
        // كحل عملي جداً: اطلب من المستخدم وضع الملفات بأسماء ثابتة أو سنحاول تخمين الاسم إذا كانت الأرقام هي تاريخ اليوم
        
        console.log("بدء محاولة تحميل الملفات تلقائياً...");
        
        for (const config of fileConfig) {
            try {
                // ملاحظة: لجعل هذا يعمل فعلياً مع أرقام متغيرة، يجب عليك إما تسمية الملفات باسم ثابت
                // أو استخدام سكريبت بسيط (PHP/Node) على السيرفر يعيد الاسم.
                // هنا سنفترض أنك قمت بتسمية الملفات بأسماء ثابتة لتجنب الخطأ التقني:
                let fileName = "";
                if(config.key === 'sales') fileName = "Report_SalesInvoiceListing.xlsx";
                if(config.key === 'col') fileName = "Report_SalesCollectionListing.xlsx";
                if(config.key === 'cust') fileName = "Report_InventoryCustomerListing.xlsx";

                const response = await fetch(fileName);
                if (!response.ok) throw new Error("File not found");
                
                const arrayBuffer = await response.arrayBuffer();
                const wb = XLSX.read(arrayBuffer, { type: 'array' });
                const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { range: config.skip });
                
                if (config.key === 'col') parseCollections(data); else db[config.key] = data;

                // جلب تاريخ تعديل الملف من الهيدر
                const lastMod = response.headers.get('Last-Modified');
                if(lastMod) {
                    const dateObj = new Date(lastMod);
                    document.getElementById('lastUpdateInfo').innerHTML = `📅 تاريخ تحديث البيانات (تاريخ رفع الملف): ${dateObj.toLocaleString('ar-SA')}`;
                }

                document.getElementById(config.statusId).innerText = `${config.key === 'sales' ? 'المبيعات' : config.key === 'col' ? 'التحصيل' : 'العملاء'}: متصل ✅`;
                document.getElementById(config.statusId).classList.add('success');
            } catch (err) {
                document.getElementById(config.statusId).innerText = `فشل تحميل ${config.key} - يرجى توحيد اسم الملف`;
            }
        }
    }

    function parseCollections(data) {
        let currentHeader = null; db.col = {};
        data.forEach(r => {
            if (r['رقم التحصيل']) currentHeader = { id: r['رقم التحصيل'], date: r['تاريخ التحصيل'], desc: r['رقم المستند'] || "" };
            let inv = String(r['العميل والفاتورة'] || "").trim();
            if (inv.startsWith('WH')) {
                if (!db.col[inv]) db.col[inv] = [];
                db.col[inv].push({ ...currentHeader, amt: cleanNum(r['المبلغ المستلم']), disc: cleanNum(r['الخصم المسموح به']) });
            }
        });
    }

    function cleanNum(v) { return parseFloat(String(v || 0).replace(/,/g, '')) || 0; }
    function toggleBlur() { document.getElementById('displayClientName').classList.toggle('blur-effect'); }
    function toggleAllDetails() {
        detailsVisible = !detailsVisible;
        document.querySelectorAll('.details-row').forEach(r => r.classList.toggle('hidden', !detailsVisible));
        document.getElementById('toggleBtn').innerText = detailsVisible ? "إخفاء السندات" : "إظهار السندات";
    }

    function searchCustomers() {
        const q = document.getElementById('query').value.toLowerCase();
        if (!q || db.cust.length === 0) return alert("البيانات لم تحمل بعد أو خانة البحث فارغة");
        const matches = db.cust.filter(c => String(c['اسم العميل']).toLowerCase().includes(q) || String(c['رمز العميل']).toLowerCase().includes(q));
        const listDiv = document.getElementById('customerList');
        if (matches.length === 1) { listDiv.style.display = 'none'; renderReport(matches[0]); }
        else if (matches.length > 1) {
            listDiv.innerHTML = `<h5 style="margin:5px 0">نتائج مطابقة، اختر العميل:</h5>`;
            matches.forEach(c => {
                listDiv.innerHTML += `<div class="cust-item" onclick='renderReport(${JSON.stringify(c).replace(/'/g, "&apos;")})'><span>${c['اسم العميل']}</span><span style="font-size:11px">رمز: ${c['رمز العميل']}</span></div>`;
            });
            listDiv.style.display = 'block';
        } else { alert("لا توجد نتائج"); }
    }

    function renderReport(client) {
        document.getElementById('customerList').style.display = 'none';
        document.getElementById('reportHeader').style.display = 'flex';
        document.getElementById('displayClientName').innerText = client['اسم العميل'];
        document.getElementById('displayClientCode').innerText = "(رمز: " + client['رمز العميل'] + ")";
        document.getElementById('toggleBtn').style.display = 'flex';

        const cSales = db.sales.filter(s => String(s['اسم العميل']).includes(client['اسم العميل']));
        const body = document.getElementById('mainBody');
        body.innerHTML = '';
        document.getElementById('stats').style.display = 'grid';
        document.getElementById('resultsArea').style.display = 'block';

        let grandTotal = 0, maxAge = 0, totalPaid = 0, months = new Set();

        cSales.forEach(s => {
            const id = s['رقم الفاتوره'], date = s['التاريخ'], method = String(s['طريقة الدفع'] || "أجل");
            const cols = db.col[id] || [];
            const invAmt = cleanNum(s['مبلغ الفاتورة']), retAmt = cleanNum(s['قيمة المرتجع']);
            const invDisc = cleanNum(s['مبلغ الخصم']), colDisc = cols.reduce((sum, c) => sum + c.disc, 0);
            
            const netReq = invAmt - retAmt - invDisc - colDisc;
            let paid = 0, age = 0;

            if (method.includes("نقدي") || method.includes("كاش")) {
                paid = netReq; age = 0;
            } else {
                paid = cols.reduce((sum, c) => sum + c.amt, 0);
                const cashCols = cols.filter(c => c.amt > 0);
                const endDate = cashCols.length > 0 ? cashCols[cashCols.length-1].date : new Date().toLocaleDateString('en-GB');
                age = diffDays(date, endDate);
            }

            const remaining = netReq - paid;
            grandTotal += netReq;
            if (age > maxAge) maxAge = age;
            trackMonths(date, (remaining > 1 ? new Date().toLocaleDateString('en-GB') : date)).forEach(m => months.add(m));
            totalPaid += paid;

            const overdueClass = (age > 30 && remaining > 1) ? 'overdue' : '';

            body.innerHTML += `
                <tr class="inv-row">
                    <td><b>${id}</b><br><small>${date}</small></td>
                    <td>${invAmt.toLocaleString()}</td>
                    <td>
                        ${retAmt > 0 ? `<span class="tag tag-ret">مرتجع: ${retAmt}</span>` : ''}
                        ${(invDisc + colDisc) > 0 ? `<span class="tag" style="background:#e0f2fe;color:#075985">خصم: ${invDisc + colDisc}</span>` : ''}
                    </td>
                    <td>${netReq.toLocaleString()}</td>
                    <td>${paid.toLocaleString()}</td>
                    <td class="${overdueClass}">${remaining > 1 ? remaining.toLocaleString() : '0'}</td>
                    <td style="text-align:center">${cols.length}</td>
                    <td><span class="${method.includes('نقدي')?'tag tag-cash':''}">${method.includes('نقدي')?'نقدي':'آجل'}</span></td>
                    <td>${age} يوم</td>
                </tr>`;

            cols.forEach(c => {
                const isDisc = c.disc > 0 && c.amt === 0;
                body.innerHTML += `
                    <tr class="details-row ${detailsVisible ? '' : 'hidden'}">
                        <td colspan="9" style="padding:0">
                            <div class="payment-box ${isDisc ? 'box-discount' : ''}">
                                <span><b>${isDisc?'خصم':'سند'}</b> #${c.id} | ${c.date}</span>
                                <span>قيمة: <b>${isDisc?c.disc:c.amt}</b> ${c.desc?`<small style="background:#fef3c7;padding:0 4px">${c.desc}</small>`:''}</span>
                                <span>عمر الدين: ${diffDays(date, c.date)} يوم</span>
                            </div>
                        </td>
                    </tr>`;
            });
        });

        document.getElementById('statPurchases').innerText = grandTotal.toLocaleString() + " ريال";
        document.getElementById('statMaxDays').innerText = maxAge + " يوم";
        const avg = months.size > 0 ? (totalPaid / months.size) : 0;
        document.getElementById('statLimit').innerText = Math.round(avg).toLocaleString() + " ريال / شهر";
    }

    function diffDays(d1, d2) {
        try {
            const p = (s) => { const a = s.split('/'); return new Date(a[2], a[1]-1, a[0]); };
            return Math.ceil(Math.abs(p(d2) - p(d1)) / 86400000);
        } catch(e) { return 0; }
    }

    function trackMonths(d1, d2) {
        let m = [];
        try {
            const p = (s) => { const a = s.split('/'); return new Date(a[2], a[1]-1, a[0]); };
            let s = p(d1), e = p(d2);
            while(s <= e) { m.push(s.getMonth()+'-'+s.getFullYear()); s.setMonth(s.getMonth()+1); }
        } catch(e) {}
        return m;
    }
</script>
</body>
</html>
