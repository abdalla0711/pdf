<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مُحفظ القرآن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .clip-container { background: white; border-radius: 1rem; padding: 0.6rem; margin-bottom: 0.5rem; border: 1px solid #e2e8f0; transition: all 0.2s; }
        .is-playing { border-color: #10b981; background-color: #f0fdf4; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .is-waiting { border-color: #3b82f6; background-color: #eff6ff; }
        #recordBtn.recording { animation: pulse 1.5s infinite; background-color: #1e293b; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .compact-input { width: 35px; height: 24px; font-size: 12px; text-align: center; border-radius: 4px; border: 1px solid #cbd5e1; }
        
        /* تعطيل اللمس الافتراضي لمنع تداخل حركات التكبير والقوائم للهواتف الذكية */
        #holdBtn {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="pb-44">

    <div class="max-w-md mx-auto p-2">
        <!-- هيدر مضغوط -->
        <header class="flex justify-between items-center py-2 px-1">
            <h1 class="text-lg font-bold text-indigo-900">مُحفظ القرآن 📖</h1>
            <button id="recordBtn" class="w-12 h-12 bg-red-500 text-white rounded-full shadow-lg flex items-center justify-center transition-all">
                <span id="recordIcon" class="text-xl">🎤</span>
            </button>
        </header>

        <!-- خيارات التكرار ونمط اللمس للأطفال -->
        <div class="bg-indigo-900 text-white rounded-xl p-3 mb-3 flex flex-col gap-2 text-xs shadow-md">
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <span>تكرار السلسلة:</span>
                    <input type="number" id="allRepeats" value="1" min="1" class="compact-input text-black font-bold">
                    <label class="flex items-center gap-1 cursor-pointer">
                        <input type="checkbox" id="infiniteRepeat" class="w-4 h-4">
                        <span>مستمر ♾️</span>
                    </label>
                </div>
                <div id="cycleStatus" class="font-bold text-indigo-200"></div>
            </div>
            <div class="border-t border-indigo-800/60 my-1"></div>
            <div class="flex items-center justify-between">
                <span>نمط التكرار التفاعلي للطفل:</span>
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" id="toggleHoldMode" class="w-4 h-4 text-indigo-600 rounded">
                    <span>الضغط المستمر للإيقاف 🛑</span>
                </label>
            </div>
        </div>

        <div id="clipsList"></div>
    </div>

    <!-- زر التوقف الكبير للطفل مع زر إنهاء الجلسة المضاف حديثاً -->
    <div id="holdOverlay" class="fixed inset-0 bg-slate-900/80 z-50 flex flex-col items-center justify-center hidden select-none">
        <div id="holdBtn" class="w-64 h-64 bg-red-600 active:bg-red-700 text-white rounded-full flex flex-col items-center justify-center shadow-[0_0_35px_rgba(239,68,68,0.6)] select-none cursor-pointer transform transition-all duration-150 active:scale-95 border-4 border-white/20">
            <span id="holdOverlayIcon" class="text-5xl mb-2">🛑</span>
            <span id="holdOverlayText" class="text-lg font-bold">اضغط واستمر للتكرار</span>
            <span id="holdOverlaySub" class="text-[11px] text-red-200 mt-2 text-center px-4 leading-relaxed">اضغط باستمرار للإيقاف المؤقت وترديد الآية، ارفع إصبعك للمتابعة</span>
        </div>
        
        <!-- زر إنهاء تشغيل الوضع الجديد -->
        <button id="overlayStopBtn" class="mt-8 bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 px-6 py-2.5 rounded-xl font-bold text-sm shadow-md active:scale-95 transition-all">
            إنهاء الجلسة ⏹️
        </button>
    </div>

    <!-- التحكم السفلي المحدث -->
    <div class="fixed bottom-0 left-0 right-0 bg-white p-3 flex flex-col gap-2 border-t z-40 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <div class="flex gap-2">
            <button id="playAllBtn" class="bg-green-600 text-white py-3 rounded-xl font-bold flex-1 shadow-lg active:scale-95 text-base">تشغيل السلسلة</button>
            <button id="stopBtn" class="bg-gray-100 text-gray-700 px-5 rounded-xl font-bold">إيقاف</button>
        </div>
        
        <!-- خيارات حفظ واستيراد وتصدير المشروع -->
        <div class="flex justify-between items-center text-[11px] mt-1 px-1">
            <button id="saveProjectBtn" class="text-indigo-600 hover:text-indigo-800 font-bold flex items-center gap-1">
                📥 حفظ المشروع
            </button>
            <label class="text-indigo-600 hover:text-indigo-800 font-bold flex items-center gap-1 cursor-pointer">
                📂 استيراد مشروع
                <input type="file" id="importProjectInput" accept=".qproj,application/json" class="hidden">
            </label>
            <button id="exportBtn" class="text-gray-400 hover:text-gray-600 font-bold">
                🎵 تصدير WAV
            </button>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let clips = [];
        let isRecording = false;
        let stopPlayback = false;
        let isHeldPaused = false; 

        const recordBtn = document.getElementById('recordBtn');
        const clipsList = document.getElementById('clipsList');
        const playAllBtn = document.getElementById('playAllBtn');
        const cycleStatus = document.getElementById('cycleStatus');
        
        const holdOverlay = document.getElementById('holdOverlay');
        const holdBtn = document.getElementById('holdBtn');
        const toggleHoldMode = document.getElementById('toggleHoldMode');

        recordBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
                    mediaRecorder = new MediaRecorder(stream, { mimeType });
                    const chunks = [];
                    mediaRecorder.ondataavailable = e => chunks.push(e.data);
                    mediaRecorder.onstop = () => addClip(new Blob(chunks, { type: mimeType }));
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    document.getElementById('recordIcon').innerText = "⏹️";
                } catch (err) { alert("فشل الوصول للميكروفون"); }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                isRecording = false;
                recordBtn.classList.remove('recording');
                document.getElementById('recordIcon').innerText = "🎤";
            }
        };

        function addClip(blob) {
            const id = Date.now();
            const clipObj = {
                id: id,
                url: URL.createObjectURL(blob),
                rawBlob: blob, // تخزين الملف الصوتي الأصلي لتسهيل الحفظ والتصدير
                repeats: 1,
                hasGap: false,
                active: true, 
                start: 0,
                end: 0,
                ws: null
            };
            clips.push(clipObj);
            renderClipItem(clipObj);
        }

        function renderClipItem(clip) {
            if (clip.active === undefined) clip.active = true;

            const container = document.createElement('div');
            container.id = `clip-${clip.id}`;
            container.className = "clip-container";
            container.innerHTML = `
                <div class="flex justify-between items-center mb-1">
                    <div class="flex items-center gap-1.5">
                        <input type="checkbox" id="check-${clip.id}" ${clip.active ? 'checked' : ''} onchange="toggleClipActive(${clip.id}, this.checked)" class="w-3.5 h-3.5 text-indigo-600 rounded cursor-pointer">
                        <span class="text-[10px] font-bold text-gray-400 uppercase">آية ${clips.length}</span>
                    </div>
                    <button onclick="deleteClip(${clip.id})" class="text-red-300 hover:text-red-500 text-[10px]">حذف</button>
                </div>
                
                <div id="wave-${clip.id}" class="h-[35px] overflow-hidden opacity-80"></div>

                <div class="flex items-center justify-between mt-2">
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-1">
                            <span class="text-[10px] font-bold">تكرار:</span>
                            <input type="number" value="${clip.repeats}" min="1" onchange="updateClip(${clip.id}, 'repeats', this.value)" class="compact-input">
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-[10px] font-bold">فراغ:</span>
                            <input type="checkbox" ${clip.hasGap ? 'checked' : ''} onchange="updateClip(${clip.id}, 'hasGap', this.checked)" class="w-3 h-3">
                        </div>
                    </div>
                    <button onclick="playSingle(${clip.id})" class="text-indigo-600 text-[10px] font-bold bg-indigo-50 px-2 py-1 rounded">تجربة 🔊</button>
                </div>
            `;
            clipsList.appendChild(container);

            const ws = WaveSurfer.create({
                container: `#wave-${clip.id}`,
                waveColor: '#cbd5e1',
                progressColor: '#6366f1',
                height: 35,
                barWidth: 2,
                url: clip.url,
            });

            const wsRegions = ws.registerPlugin(WaveSurfer.Regions.create());
            ws.on('ready', () => {
                const duration = ws.getDuration();
                if (clip.end === 0 || clip.end > duration) {
                    clip.end = duration;
                }
                wsRegions.addRegion({ 
                    id: 'r', 
                    start: clip.start, 
                    end: clip.end, 
                    color: 'rgba(99, 102, 241, 0.1)', 
                    drag: true, 
                    resize: true 
                });
            });
            wsRegions.on('region-updated', (region) => { clip.start = region.start; clip.end = region.end; });
            clip.ws = ws;
        }

        function toggleClipActive(id, isActive) {
            const clip = clips.find(c => c.id === id);
            if (clip) clip.active = isActive;
        }

        function updateClip(id, key, val) {
            const clip = clips.find(c => c.id === id);
            if (clip) clip[key] = (key === 'hasGap') ? val : parseInt(val);
        }

        function deleteClip(id) {
            clips = clips.filter(c => c.id !== id);
            document.getElementById(`clip-${id}`).remove();
        }

        async function playClipLogic(clip) {
            const el = document.getElementById(`clip-${clip.id}`);
            const duration = clip.end - clip.start;

            for (let r = 0; r < clip.repeats; r++) {
                if (stopPlayback) break;
                clip.ws.setTime(clip.start);
                el.className = "clip-container is-playing";
                
                clip.ws.play();

                while (clip.ws.getCurrentTime() < clip.end) {
                    if (stopPlayback) break;

                    if (isHeldPaused) {
                        if (clip.ws.isPlaying()) {
                            clip.ws.pause();
                        }
                    } else {
                        if (!clip.ws.isPlaying() && !stopPlayback) {
                            clip.ws.play();
                        }
                    }
                    await new Promise(res => setTimeout(res, 50));
                }

                clip.ws.pause();

                if (stopPlayback) break;
                await new Promise(r => setTimeout(r, 100)); 

                if (clip.hasGap) {
                    el.className = "clip-container is-waiting";
                    const totalGapMs = duration * 1000;
                    let gapElapsed = 0;
                    while (gapElapsed < totalGapMs) {
                        if (stopPlayback) break;
                        if (!isHeldPaused) {
                            gapElapsed += 100;
                        }
                        await new Promise(res => setTimeout(res, 100));
                    }
                }
                el.className = "clip-container";
            }
        }

        async function playSingle(id) {
            stopPlayback = false;
            const clip = clips.find(c => c.id === id);
            if (clip) await playClipLogic(clip);
        }

        playAllBtn.onclick = async () => {
            stopPlayback = false;
            
            const activeClips = clips.filter(c => c.active);
            if (activeClips.length === 0) {
                alert("الرجاء اختيار مقطع واحد على الأقل للتشغيل");
                return;
            }

            playAllBtn.disabled = true;
            const infinite = document.getElementById('infiniteRepeat').checked;
            const totalCycles = parseInt(document.getElementById('allRepeats').value);

            if (toggleHoldMode.checked) {
                holdOverlay.classList.remove('hidden');
            }
            
            let currentCycle = 0;
            while (infinite || currentCycle < totalCycles) {
                if (stopPlayback) break;
                currentCycle++;
                cycleStatus.innerText = infinite ? `دورة: ${currentCycle}` : `دورة: ${currentCycle} / ${totalCycles}`;
                
                for (const clip of activeClips) {
                    if (stopPlayback) break;
                    await playClipLogic(clip);
                }
            }
            
            cycleStatus.innerText = "";
            playAllBtn.disabled = false;
            holdOverlay.classList.add('hidden');
        };

        // دالة الإيقاف المشتركة
        function handleGlobalStop() {
            stopPlayback = true;
            isHeldPaused = false;
            holdOverlay.classList.add('hidden');
            clips.forEach(c => {
                if (c.ws) c.ws.pause();
                const el = document.getElementById(`clip-${c.id}`);
                if (el) el.className = "clip-container";
            });
            playAllBtn.disabled = false;
        }

        document.getElementById('stopBtn').onclick = handleGlobalStop;
        
        // ربط حدث زر إنهاء الجلسة الإضافي داخل نمط الضغط المستمر
        document.getElementById('overlayStopBtn').onclick = (e) => {
            e.stopPropagation(); // منع تداخل اللمس مع الحاوية الخلفية
            handleGlobalStop();
        };

        function setHoldState(active) {
            const holdBtnEl = document.getElementById('holdBtn');
            const icon = document.getElementById('holdOverlayIcon');
            const text = document.getElementById('holdOverlayText');
            const subText = document.getElementById('holdOverlaySub');

            if (active) {
                isHeldPaused = true;
                holdBtnEl.classList.remove('bg-red-600', 'active:bg-red-700');
                holdBtnEl.classList.add('bg-green-600');
                icon.innerText = "🗣️";
                text.innerText = "ردد الآن... طفلك يتكلم";
                subText.innerText = "أبقِ إصبعك على الزر حتى تفرغ من التكرار، ثم ارفعه للاستمرار";
            } else {
                isHeldPaused = false;
                holdBtnEl.classList.remove('bg-green-600');
                holdBtnEl.classList.add('bg-red-600', 'active:bg-red-700');
                icon.innerText = "🛑";
                text.innerText = "اضغط واستمر للتكرار";
                subText.innerText = "اضغط باستمرار للإيقاف المؤقت وترديد الآية، ارفع إصبعك للمتابعة";
            }
        }

        holdBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setHoldState(true); });
        holdBtn.addEventListener('touchend', (e) => { e.preventDefault(); setHoldState(false); });
        holdBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); setHoldState(false); });

        holdBtn.addEventListener('mousedown', (e) => { e.preventDefault(); setHoldState(true); });
        holdBtn.addEventListener('mouseup', (e) => { e.preventDefault(); setHoldState(false); });
        holdBtn.addEventListener('mouseleave', (e) => { e.preventDefault(); setHoldState(false); });
        holdBtn.addEventListener('contextmenu', (e) => { e.preventDefault(); });

        // --- ميزات حفظ واستيراد المشروع الجديدة ---

        // تحويل الملف الصوتي الثنائي إلى نص Base64 للحفظ
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        // تحويل النص Base64 المستورد إلى ملف صوتي ثنائي لتهيئته
        async function base64ToBlob(base64Uri) {
            const res = await fetch(base64Uri);
            return await res.blob();
        }

        // دالة حفظ المشروع الحالي
        document.getElementById('saveProjectBtn').onclick = async () => {
            if (clips.length === 0) {
                alert("لا توجد مقاطع لحفظها في المشروع حالياً.");
                return;
            }

            // توليد الاسم الافتراضي بالتاريخ والساعة والدقيقة
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const defaultName = `مشروع_محفظ_${year}-${month}-${day}_${hours}-${minutes}`;

            // السؤال عن اسم المشروع مع إتاحة الخيار الافتراضي
            let projectName = prompt("أدخل اسماً مخصصاً للمشروع، أو اضغط موافق للاحتفاظ بالاسم الافتراضي المقترح:", defaultName);
            if (projectName === null) return; // تم إلغاء العملية
            projectName = projectName.trim() || defaultName;

            const serializedClips = [];
            for (const clip of clips) {
                let base64 = "";
                if (clip.rawBlob) {
                    base64 = await blobToBase64(clip.rawBlob);
                } else {
                    const response = await fetch(clip.url);
                    const blob = await response.blob();
                    base64 = await blobToBase64(blob);
                }
                serializedClips.push({
                    id: clip.id,
                    repeats: clip.repeats,
                    hasGap: clip.hasGap,
                    active: clip.active !== false,
                    start: clip.start,
                    end: clip.end,
                    audioBase64: base64
                });
            }

            const projectData = {
                version: 1,
                allRepeats: parseInt(document.getElementById('allRepeats').value) || 1,
                infiniteRepeat: document.getElementById('infiniteRepeat').checked,
                toggleHoldMode: document.getElementById('toggleHoldMode').checked,
                clips: serializedClips
            };

            const jsonStr = JSON.stringify(projectData);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${projectName}.qproj`;
            a.click();
        };

        // دالة استيراد مشروع سابق
        document.getElementById('importProjectInput').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (evt) => {
                try {
                    const projectData = JSON.parse(evt.target.result);
                    if (!projectData || !Array.isArray(projectData.clips)) {
                        throw new Error("بنية ملف المشروع غير صالحة.");
                    }

                    // إفراغ المقاطع الحالية لتجنب التداخل
                    clips.forEach(c => {
                        if (c.ws) {
                            try { c.ws.destroy(); } catch(err){}
                        }
                    });
                    clips = [];
                    clipsList.innerHTML = "";

                    // استعادة الإعدادات العامة
                    document.getElementById('allRepeats').value = projectData.allRepeats || 1;
                    document.getElementById('infiniteRepeat').checked = !!projectData.infiniteRepeat;
                    document.getElementById('toggleHoldMode').checked = !!projectData.toggleHoldMode;

                    // استيراد المقاطع وتجهيزها
                    for (const sClip of projectData.clips) {
                        const blob = await base64ToBlob(sClip.audioBase64);
                        const clipObj = {
                            id: sClip.id || Date.now() + Math.random(),
                            url: URL.createObjectURL(blob),
                            rawBlob: blob,
                            repeats: sClip.repeats || 1,
                            hasGap: !!sClip.hasGap,
                            active: sClip.active !== false,
                            start: sClip.start || 0,
                            end: sClip.end || 0,
                            ws: null
                        };
                        clips.push(clipObj);
                        renderClipItem(clipObj);
                    }

                    alert("تم استيراد المشروع بنجاح!");
                } catch (err) {
                    alert("فشل استيراد المشروع، يرجى التأكد من اختيار ملف مشروع صحيح: " + err.message);
                }
                e.target.value = ""; // تصفير حقل الاختيار
            };
            reader.readAsText(file);
        };

        // تصدير WAV النهائي للمقاطع المحددة فقط
        document.getElementById('exportBtn').onclick = async () => {
            const activeClips = clips.filter(c => c.active);
            if (activeClips.length === 0) {
                alert("الرجاء تحديد مقطع واحد على الأقل لتصديره");
                return;
            }
            const audioCtx = new AudioContext();
            let totalDur = 0;
            const buffers = [];
            for (const clip of activeClips) {
                const res = await fetch(clip.url);
                const ab = await audioCtx.decodeAudioData(await res.arrayBuffer());
                const d = clip.end - clip.start;
                totalDur += (clip.hasGap ? d * 2 : d) * clip.repeats;
                buffers.push({ ab, clip, d });
            }
            const offCtx = new OfflineAudioContext(1, 44100 * totalDur, 44100);
            let offset = 0;
            for (const b of buffers) {
                for (let r = 0; r < b.clip.repeats; r++) {
                    const s = offCtx.createBufferSource();
                    s.buffer = b.ab; s.connect(offCtx.destination);
                    s.start(offset, b.clip.start, b.d);
                    offset += b.d;
                    if (b.clip.hasGap) offset += b.d;
                }
            }
            const rendered = await offCtx.startRendering();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(bufferToWav(rendered));
            a.download = "quran_session.wav"; a.click();
        };

        function bufferToWav(abuffer) {
            let n = abuffer.numberOfChannels, len = abuffer.length * n * 2 + 44,
                buf = new ArrayBuffer(len), view = new DataView(buf), pos = 0;
            const s32 = (d) => { view.setUint32(pos, d, true); pos += 4; };
            const s16 = (d) => { view.setUint16(pos, d, true); pos += 2; };
            s32(0x46464952); s32(len - 8); s32(0x45564157); s32(0x20746d66); s32(16); s16(1); s16(n);
            s32(abuffer.sampleRate); s32(abuffer.sampleRate * 2 * n); s16(n * 2); s16(16);
            s32(0x61746164); s32(len - pos - 4);
            for (let i = 0; i < abuffer.length; i++) {
                for (let ch = 0; ch < n; ch++) {
                    let s = Math.max(-1, Math.min(1, abuffer.getChannelData(ch)[i]));
                    view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true); pos += 2;
                }
            }
            return new Blob([buf], { type: "audio/wav" });
        }
    </script>
</body>
</html>
