<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مُحفظ القرآن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .clip-container { background: white; border-radius: 1.5rem; padding: 1rem; margin-bottom: 1rem; border: 2px solid #e2e8f0; transition: all 0.3s ease; }
        .is-playing { border-color: #10b981; background-color: #f0fdf4; transform: scale(1.02); shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .is-waiting { border-color: #3b82f6; background-color: #eff6ff; }
        #recordBtn.recording { background-color: #1e293b; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
        .wave-wrapper { background: #fdfdfd; border-radius: 0.75rem; border: 1px solid #f1f5f9; overflow: hidden; }
    </style>
</head>
<body class="pb-44">

    <div class="max-w-md mx-auto p-4">
        <header class="text-center py-6">
            <h1 class="text-2xl font-bold text-indigo-900">مُحفظ القرآن 📖</h1>
            <p class="text-gray-500 text-sm font-medium">أداة تسجيل وتحفيظ ذكية</p>
        </header>

        <!-- زر التسجيل الرئيسي -->
        <div class="flex flex-col items-center mb-8">
            <button id="recordBtn" class="w-20 h-20 bg-red-500 text-white rounded-full shadow-2xl flex items-center justify-center transition-all">
                <span id="recordIcon" class="text-3xl">🎤</span>
            </button>
            <p id="recordLabel" class="mt-3 font-bold text-gray-700">اضغط للتسجيل</p>
        </div>

        <div id="clipsList" class="space-y-4"></div>
    </div>

    <!-- التحكم السفلي -->
    <div class="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-10px_20px_rgba(0,0,0,0.05)] p-4 flex flex-col gap-3 border-t z-50">
        <div class="flex gap-2">
            <button id="playAllBtn" class="bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-bold flex-1 shadow-lg active:scale-95 transition-all text-lg">تشغيل الكل بالتتالي</button>
            <button id="stopBtn" class="bg-gray-100 text-gray-700 px-6 rounded-2xl font-bold hover:bg-gray-200">إيقاف</button>
        </div>
        <button id="exportBtn" class="bg-indigo-50 text-indigo-700 py-2 rounded-xl text-xs font-bold border border-indigo-100">تحميل المشروع كاملاً (ملف واحد)</button>
    </div>

    <script>
        let mediaRecorder;
        let clips = [];
        let isRecording = false;
        let stopPlayback = false;

        const recordBtn = document.getElementById('recordBtn');
        const clipsList = document.getElementById('clipsList');
        const playAllBtn = document.getElementById('playAllBtn');

        // 1. معالجة التسجيل
        recordBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
                    mediaRecorder = new MediaRecorder(stream, { mimeType });
                    const chunks = [];
                    
                    mediaRecorder.ondataavailable = e => chunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: mimeType });
                        addClip(blob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    document.getElementById('recordIcon').innerText = "⏹️";
                    document.getElementById('recordLabel').innerText = "جاري التسجيل حالياً...";
                } catch (err) {
                    alert("يرجى تفعيل صلاحية الميكروفون.");
                }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                isRecording = false;
                recordBtn.classList.remove('recording');
                document.getElementById('recordIcon').innerText = "🎤";
                document.getElementById('recordLabel').innerText = "اضغط للتسجيل";
            }
        };

        // 2. إضافة مقطع جديد
        function addClip(blob) {
            const id = Date.now();
            const url = URL.createObjectURL(blob);
            
            const clipObj = {
                id: id,
                url: url,
                blob: blob,
                repeats: 1,
                hasGap: false, // تم التغيير إلى false بشكل افتراضي
                start: 0,
                end: 0,
                ws: null
            };
            
            clips.push(clipObj);
            renderClipItem(clipObj);
        }

        function renderClipItem(clip) {
            const container = document.createElement('div');
            container.id = `clip-${clip.id}`;
            container.className = "clip-container shadow-sm transition-all";
            container.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-bold bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full border border-indigo-100">مقطع ${clips.indexOf(clip)+1}</span>
                    <button onclick="deleteClip(${clip.id})" class="text-red-400 hover:text-red-600 text-xs font-bold">حذف</button>
                </div>
                
                <div class="wave-wrapper p-2">
                    <div id="wave-${clip.id}"></div>
                </div>

                <div class="flex items-center justify-between gap-2 bg-gray-50 p-3 rounded-2xl mt-4">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-gray-600">تكرار:</span>
                        <input type="number" value="1" min="1" onchange="updateClip(${clip.id}, 'repeats', this.value)" class="w-12 h-8 rounded-lg border-none text-center bg-white shadow-sm font-bold text-indigo-600">
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-gray-600">فراغ ترديد:</span>
                        <input type="checkbox" onchange="updateClip(${clip.id}, 'hasGap', this.checked)" class="w-5 h-5 rounded border-gray-300 text-indigo-600">
                    </div>
                    <button onclick="playSingle(${clip.id})" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md">تجربة</button>
                </div>
                <div id="status-${clip.id}" class="text-[11px] text-center mt-3 h-4 font-bold text-indigo-500"></div>
            `;
            clipsList.appendChild(container);

            const ws = WaveSurfer.create({
                container: `#wave-${clip.id}`,
                waveColor: '#d1d5db',
                progressColor: '#6366f1',
                height: 50,
                barWidth: 2,
                barGap: 3,
                barRadius: 4,
                url: clip.url,
            });

            const wsRegions = ws.registerPlugin(WaveSurfer.Regions.create());
            
            ws.on('ready', () => {
                clip.end = ws.getDuration();
                wsRegions.addRegion({
                    id: 'trim-region',
                    start: 0,
                    end: ws.getDuration(),
                    color: 'rgba(99, 102, 241, 0.15)',
                    drag: true,
                    resize: true
                });
            });

            wsRegions.on('region-updated', (region) => {
                clip.start = region.start;
                clip.end = region.end;
            });

            clip.ws = ws;
        }

        function updateClip(id, key, val) {
            const clip = clips.find(c => c.id === id);
            if (clip) clip[key] = (key === 'hasGap') ? val : parseInt(val);
        }

        function deleteClip(id) {
            clips = clips.filter(c => c.id !== id);
            document.getElementById(`clip-${id}`).remove();
        }

        // 3. محرك التشغيل المطور (يمنع التداخل)
        async function playSingle(id) {
            stopPlayback = false;
            const clip = clips.find(c => c.id === id);
            if (clip) await playClipLogic(clip);
        }

        async function playClipLogic(clip) {
            const el = document.getElementById(`clip-${clip.id}`);
            const status = document.getElementById(`status-${clip.id}`);
            const duration = clip.end - clip.start;

            for (let r = 0; r < clip.repeats; r++) {
                if (stopPlayback) break;

                // أ- مرحلة الصوت
                el.className = "clip-container shadow-md is-playing";
                status.innerText = `جاري القراءة... (مرة ${r+1})`;
                
                await new Promise(resolve => {
                    clip.ws.play(clip.start, clip.end);
                    
                    // نستخدم حدث التوقف للتأكد من انتهاء المقطع تماماً
                    const onPause = () => {
                        clip.ws.un('pause', onPause);
                        resolve();
                    };
                    clip.ws.on('pause', onPause);
                });

                if (stopPlayback) break;

                // ب- مرحلة الفراغ (فقط إذا كان الخيار مفعلاً)
                if (clip.hasGap) {
                    el.className = "clip-container shadow-md is-waiting";
                    status.innerText = `الآن دور الطفل للترديد...`;
                    await new Promise(resolve => {
                        const timer = setTimeout(resolve, duration * 1000);
                        // إذا ضغط إيقاف أثناء الصمت
                        if (stopPlayback) clearTimeout(timer);
                    });
                }
                
                el.className = "clip-container shadow-sm";
            }
            status.innerText = "";
        }

        playAllBtn.onclick = async () => {
            stopPlayback = false;
            playAllBtn.disabled = true;
            playAllBtn.innerText = "جاري تشغيل السلسلة...";

            for (let i = 0; i < clips.length; i++) {
                if (stopPlayback) break;
                await playClipLogic(clips[i]);
            }

            playAllBtn.disabled = false;
            playAllBtn.innerText = "تشغيل الكل بالتتالي";
        };

        document.getElementById('stopBtn').onclick = () => {
            stopPlayback = true;
            clips.forEach(c => {
                c.ws.pause();
                const el = document.getElementById(`clip-${c.id}`);
                if (el) el.className = "clip-container shadow-sm";
            });
            playAllBtn.disabled = false;
            playAllBtn.innerText = "تشغيل الكل بالتتالي";
        };

        // 4. تصدير المشروع مدمجاً
        document.getElementById('exportBtn').onclick = async () => {
            if (clips.length === 0) return alert("سجل بعض المقاطع أولاً");
            
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let totalDur = 0;
            
            // حساب المدة الدقيقة للملف النهائي
            const dataBuffers = [];
            for (const clip of clips) {
                const response = await fetch(clip.url);
                const arrayBuf = await response.arrayBuffer();
                const audioBuf = await audioCtx.decodeAudioData(arrayBuf);
                
                const partDur = clip.end - clip.start;
                const iterationDur = clip.hasGap ? partDur * 2 : partDur;
                totalDur += iterationDur * clip.repeats;
                dataBuffers.push({ audioBuf, clip, partDur });
            }

            const offlineCtx = new OfflineAudioContext(1, 44100 * totalDur, 44100);
            let offset = 0;

            for (const item of dataBuffers) {
                for (let r = 0; r < item.clip.repeats; r++) {
                    const source = offlineCtx.createBufferSource();
                    source.buffer = item.audioBuf;
                    source.connect(offlineCtx.destination);
                    source.start(offset, item.clip.start, item.partDur);
                    offset += item.partDur;
                    if (item.clip.hasGap) offset += item.partDur; 
                }
            }

            const renderedBuffer = await offlineCtx.startRendering();
            const wavBlob = bufferToWav(renderedBuffer);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(wavBlob);
            a.download = `quran_lesson_${Date.now()}.wav`;
            a.click();
        };

        function bufferToWav(abuffer) {
            let n = abuffer.numberOfChannels, len = abuffer.length * n * 2 + 44,
                buf = new ArrayBuffer(len), view = new DataView(buf), pos = 0;
            const s32 = (d) => { view.setUint32(pos, d, true); pos += 4; };
            const s16 = (d) => { view.setUint16(pos, d, true); pos += 2; };
            s32(0x46464952); s32(len - 8); s32(0x45564157); s32(0x20746d66); s32(16); s16(1); s16(n);
            s32(abuffer.sampleRate); s32(abuffer.sampleRate * 2 * n); s16(n * 2); s16(16);
            s32(0x61746164); s32(len - pos - 4);
            for (let i = 0; i < abuffer.length; i++) {
                for (let ch = 0; ch < n; ch++) {
                    let s = Math.max(-1, Math.min(1, abuffer.getChannelData(ch)[i]));
                    view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true); pos += 2;
                }
            }
            return new Blob([buf], { type: "audio/wav" });
        }
    </script>
</body>
</html>
