<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مُحفظ القرآن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة الموجات الصوتية - إصدار مستقر -->
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .clip-container { background: white; border-radius: 1.5rem; padding: 1rem; margin-bottom: 1rem; border: 2px solid #e2e8f0; }
        .is-playing { border-color: #10b981; background-color: #f0fdf4; }
        .is-waiting { border-color: #3b82f6; background-color: #eff6ff; }
        #recordBtn.recording { background-color: #1e293b; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="pb-40">

    <div class="max-w-md mx-auto p-4">
        <header class="text-center py-6">
            <h1 class="text-2xl font-bold text-indigo-900">مُحفظ القرآن 📖</h1>
            <p class="text-gray-500 text-sm">سجل الآيات وكررها بسهولة</p>
        </header>

        <!-- زر التسجيل الرئيسي -->
        <div class="flex flex-col items-center mb-8">
            <button id="recordBtn" class="w-20 h-20 bg-red-500 text-white rounded-full shadow-2xl flex items-center justify-center transition-all">
                <span id="recordIcon" class="text-3xl">🎤</span>
            </button>
            <p id="recordLabel" class="mt-2 font-bold text-gray-700">اضغط للتسجيل</p>
        </div>

        <div id="clipsList"></div>
    </div>

    <!-- التحكم السفلي -->
    <div class="fixed bottom-0 left-0 right-0 bg-white shadow-up p-4 flex flex-col gap-2 border-t z-50">
        <div class="flex gap-2">
            <button id="playAllBtn" class="bg-green-600 text-white py-4 rounded-2xl font-bold flex-1 shadow-lg active:scale-95">تشغيل الكل بالتتالي</button>
            <button id="stopBtn" class="bg-gray-200 text-gray-700 px-6 rounded-2xl font-bold">إيقاف</button>
        </div>
        <button id="exportBtn" class="bg-indigo-100 text-indigo-700 py-2 rounded-xl text-sm font-bold">حفظ المشروع كملف واحد (WAV)</button>
    </div>

    <script>
        let mediaRecorder;
        let clips = [];
        let isRecording = false;
        let stopPlayback = false;

        const recordBtn = document.getElementById('recordBtn');
        const clipsList = document.getElementById('clipsList');
        const playAllBtn = document.getElementById('playAllBtn');

        // 1. معالجة التسجيل
        recordBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
                    mediaRecorder = new MediaRecorder(stream, { mimeType });
                    const chunks = [];
                    
                    mediaRecorder.ondataavailable = e => chunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(chunks, { type: mimeType });
                        addClip(blob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    document.getElementById('recordIcon').innerText = "⏹️";
                    document.getElementById('recordLabel').innerText = "جاري التسجيل...";
                } catch (err) {
                    alert("خطأ: يرجى تفعيل صلاحية الميكروفون. تأكد أن الرابط يبدأ بـ HTTPS");
                }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                isRecording = false;
                recordBtn.classList.remove('recording');
                document.getElementById('recordIcon').innerText = "🎤";
                document.getElementById('recordLabel').innerText = "اضغط للتسجيل";
            }
        };

        // 2. إضافة مقطع جديد للقائمة
        function addClip(blob) {
            const id = Date.now();
            const url = URL.createObjectURL(blob);
            
            const clipObj = {
                id: id,
                url: url,
                blob: blob,
                repeats: 1,
                hasGap: true,
                start: 0,
                end: 0,
                ws: null
            };
            
            clips.push(clipObj);
            renderClipItem(clipObj);
        }

        function renderClipItem(clip) {
            const container = document.createElement('div');
            container.id = `clip-${clip.id}`;
            container.className = "clip-container shadow-sm transition-all";
            container.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2 py-1 rounded">مقطع جديد</span>
                    <button onclick="deleteClip(${clip.id})" class="text-red-400 text-xs">حذف</button>
                </div>
                <div id="wave-${clip.id}" class="mb-2"></div>
                <div class="flex items-center justify-between gap-2 bg-gray-50 p-3 rounded-xl mt-3">
                    <div class="flex items-center gap-1">
                        <span class="text-xs">تكرار:</span>
                        <input type="number" value="1" min="1" onchange="updateClip(${clip.id}, 'repeats', this.value)" class="w-10 border-b text-center bg-transparent font-bold">
                    </div>
                    <div class="flex items-center gap-1">
                        <span class="text-xs">فراغ:</span>
                        <input type="checkbox" checked onchange="updateClip(${clip.id}, 'hasGap', this.checked)" class="w-4 h-4">
                    </div>
                    <button onclick="playSingle(${clip.id})" class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs font-bold">تجربة</button>
                </div>
                <div id="status-${clip.id}" class="text-[10px] text-center mt-2 h-3 font-bold text-indigo-500"></div>
            `;
            clipsList.appendChild(container);

            // إعداد الموجات
            const ws = WaveSurfer.create({
                container: `#wave-${clip.id}`,
                waveColor: '#94a3b8',
                progressColor: '#4f46e5',
                height: 50,
                barWidth: 2,
                url: clip.url,
            });

            const wsRegions = ws.registerPlugin(WaveSurfer.Regions.create());
            
            ws.on('ready', () => {
                clip.end = ws.getDuration();
                wsRegions.addRegion({
                    start: 0,
                    end: ws.getDuration(),
                    color: 'rgba(79, 70, 229, 0.1)',
                    drag: true,
                    resize: true
                });
            });

            wsRegions.on('region-updated', (region) => {
                clip.start = region.start;
                clip.end = region.end;
            });

            clip.ws = ws;
        }

        function updateClip(id, key, val) {
            const clip = clips.find(c => c.id === id);
            if (clip) clip[key] = (key === 'hasGap') ? val : parseInt(val);
        }

        function deleteClip(id) {
            clips = clips.filter(c => c.id !== id);
            document.getElementById(`clip-${id}`).remove();
        }

        // 3. محرك التشغيل (متوافق مع آيفون)
        async function playSingle(id) {
            stopPlayback = false;
            const clip = clips.find(c => c.id === id);
            await playLogic(clip, clips.indexOf(clip));
        }

        async function playLogic(clip, index) {
            const el = document.getElementById(`clip-${clip.id}`);
            const status = document.getElementById(`status-${clip.id}`);
            
            for (let r = 0; r < clip.repeats; r++) {
                if (stopPlayback) break;

                // التشغيل
                el.classList.add('is-playing');
                status.innerText = `جاري التشغيل (${r+1}/${clip.repeats})`;
                
                await new Promise(resolve => {
                    clip.ws.play(clip.start, clip.end);
                    clip.ws.on('pause', resolve, { once: true });
                });

                if (stopPlayback) break;

                // الفراغ
                if (clip.hasGap) {
                    el.classList.remove('is-playing');
                    el.classList.add('is-waiting');
                    status.innerText = `انتظر وردد...`;
                    await new Promise(resolve => setTimeout(resolve, (clip.end - clip.start) * 1000));
                    el.classList.remove('is-waiting');
                }
            }
            el.classList.remove('is-playing', 'is-waiting');
            status.innerText = "";
        }

        playAllBtn.onclick = async () => {
            stopPlayback = false;
            for (let i = 0; i < clips.length; i++) {
                if (stopPlayback) break;
                await playLogic(clips[i], i);
            }
        };

        document.getElementById('stopBtn').onclick = () => {
            stopPlayback = true;
            clips.forEach(c => c.ws.pause());
        };

        // 4. دمج المقاطع وتصديرها كملف واحد
        document.getElementById('exportBtn').onclick = async () => {
            if (clips.length === 0) return alert("لا توجد مقاطع لدمجها");
            alert("بدء معالجة الملف... قد يستغرق ذلك لحظات");
            
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let totalDur = 0;
            
            // حساب المدة الإجمالية
            const buffers = [];
            for (const clip of clips) {
                const response = await fetch(clip.url);
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                const partDur = clip.end - clip.start;
                const fullPartDur = clip.hasGap ? partDur * 2 : partDur;
                totalDur += fullPartDur * clip.repeats;
                buffers.push({ buffer: audioBuffer, clip });
            }

            const offlineCtx = new OfflineAudioContext(1, 44100 * totalDur, 44100);
            let offset = 0;

            for (const item of buffers) {
                const partDur = item.clip.end - item.clip.start;
                for (let r = 0; r < item.clip.repeats; r++) {
                    const source = offlineCtx.createBufferSource();
                    source.buffer = item.buffer;
                    source.connect(offlineCtx.destination);
                    source.start(offset, item.clip.start, partDur);
                    offset += partDur;
                    if (item.clip.hasGap) offset += partDur; // إضافة فراغ صامت
                }
            }

            const renderedBuffer = await offlineCtx.startRendering();
            const wavBlob = bufferToWav(renderedBuffer);
            const downloadUrl = URL.createObjectURL(wavBlob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = "quran_all_clips.wav";
            a.click();
        };

        // وظيفة مساعدة لتحويل AudioBuffer إلى WAV
        function bufferToWav(abuffer) {
            let numOfChan = abuffer.numberOfChannels,
                length = abuffer.length * numOfChan * 2 + 44,
                buffer = new ArrayBuffer(length),
                view = new DataView(buffer),
                pos = 0;

            const setUint32 = (d) => { view.setUint32(pos, d, true); pos += 4; };
            const setUint16 = (d) => { view.setUint16(pos, d, true); pos += 2; };

            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
            setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
            setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);

            for (let i = 0; i < abuffer.length; i++) {
                for (let ch = 0; ch < numOfChan; ch++) {
                    let s = Math.max(-1, Math.min(1, abuffer.getChannelData(ch)[i]));
                    view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                    pos += 2;
                }
            }
            return new Blob([buffer], { type: "audio/wav" });
        }
    </script>
</body>
</html>
