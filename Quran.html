<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مُحفظ القرآن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .clip-container { background: white; border-radius: 1rem; padding: 0.6rem; margin-bottom: 0.5rem; border: 1px solid #e2e8f0; transition: all 0.2s; }
        .is-playing { border-color: #10b981; background-color: #f0fdf4; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .is-waiting { border-color: #3b82f6; background-color: #eff6ff; }
        #recordBtn.recording { animation: pulse 1.5s infinite; background-color: #1e293b; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .compact-input { width: 35px; height: 24px; font-size: 12px; text-align: center; border-radius: 4px; border: 1px solid #cbd5e1; }
    </style>
</head>
<body class="pb-44">

    <div class="max-w-md mx-auto p-2">
        <!-- هيدر مضغوط -->
        <header class="flex justify-between items-center py-2 px-1">
            <h1 class="text-lg font-bold text-indigo-900">مُحفظ القرآن 📖</h1>
            <button id="recordBtn" class="w-12 h-12 bg-red-500 text-white rounded-full shadow-lg flex items-center justify-center transition-all">
                <span id="recordIcon" class="text-xl">🎤</span>
            </button>
        </header>

        <!-- خيارات تكرار الكل -->
        <div class="bg-indigo-900 text-white rounded-xl p-2 mb-3 flex items-center justify-between text-xs shadow-md">
            <div class="flex items-center gap-2">
                <span>تكرار القائمة:</span>
                <input type="number" id="allRepeats" value="1" min="1" class="compact-input text-black font-bold">
                <label class="flex items-center gap-1 cursor-pointer">
                    <input type="checkbox" id="infiniteRepeat" class="w-4 h-4">
                    <span>مستمر ♾️</span>
                </label>
            </div>
            <div id="cycleStatus" class="font-bold text-indigo-200"></div>
        </div>

        <div id="clipsList"></div>
    </div>

    <!-- التحكم السفلي -->
    <div class="fixed bottom-0 left-0 right-0 bg-white p-3 flex flex-col gap-2 border-t z-50 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <div class="flex gap-2">
            <button id="playAllBtn" class="bg-green-600 text-white py-3 rounded-xl font-bold flex-1 shadow-lg active:scale-95 text-base">تشغيل السلسلة</button>
            <button id="stopBtn" class="bg-gray-100 text-gray-700 px-5 rounded-xl font-bold">إيقاف</button>
        </div>
        <button id="exportBtn" class="text-gray-400 py-1 text-[10px] font-bold uppercase tracking-wider">حفظ المشروع (WAV)</button>
    </div>

    <script>
        let mediaRecorder;
        let clips = [];
        let isRecording = false;
        let stopPlayback = false;

        const recordBtn = document.getElementById('recordBtn');
        const clipsList = document.getElementById('clipsList');
        const playAllBtn = document.getElementById('playAllBtn');
        const cycleStatus = document.getElementById('cycleStatus');

        recordBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
                    mediaRecorder = new MediaRecorder(stream, { mimeType });
                    const chunks = [];
                    mediaRecorder.ondataavailable = e => chunks.push(e.data);
                    mediaRecorder.onstop = () => addClip(new Blob(chunks, { type: mimeType }));
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    document.getElementById('recordIcon').innerText = "⏹️";
                } catch (err) { alert("فشل الوصول للميكروفون"); }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                isRecording = false;
                recordBtn.classList.remove('recording');
                document.getElementById('recordIcon').innerText = "🎤";
            }
        };

        function addClip(blob) {
            const id = Date.now();
            const clipObj = {
                id: id,
                url: URL.createObjectURL(blob),
                repeats: 1,
                hasGap: false,
                start: 0,
                end: 0,
                ws: null
            };
            clips.push(clipObj);
            renderClipItem(clipObj);
        }

        function renderClipItem(clip) {
            const container = document.createElement('div');
            container.id = `clip-${clip.id}`;
            container.className = "clip-container";
            container.innerHTML = `
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[10px] font-bold text-gray-400 uppercase">آية ${clips.length}</span>
                    <button onclick="deleteClip(${clip.id})" class="text-red-300 hover:text-red-500 text-[10px]">حذف</button>
                </div>
                
                <div id="wave-${clip.id}" class="h-[35px] overflow-hidden opacity-80"></div>

                <div class="flex items-center justify-between mt-2">
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-1">
                            <span class="text-[10px] font-bold">تكرار:</span>
                            <input type="number" value="1" min="1" onchange="updateClip(${clip.id}, 'repeats', this.value)" class="compact-input">
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-[10px] font-bold">فراغ:</span>
                            <input type="checkbox" onchange="updateClip(${clip.id}, 'hasGap', this.checked)" class="w-3 h-3">
                        </div>
                    </div>
                    <button onclick="playSingle(${clip.id})" class="text-indigo-600 text-[10px] font-bold bg-indigo-50 px-2 py-1 rounded">تجربة 🔊</button>
                </div>
            `;
            clipsList.appendChild(container);

            const ws = WaveSurfer.create({
                container: `#wave-${clip.id}`,
                waveColor: '#cbd5e1',
                progressColor: '#6366f1',
                height: 35,
                barWidth: 2,
                url: clip.url,
            });

            const wsRegions = ws.registerPlugin(WaveSurfer.Regions.create());
            ws.on('ready', () => {
                clip.end = ws.getDuration();
                wsRegions.addRegion({ id: 'r', start: 0, end: ws.getDuration(), color: 'rgba(99, 102, 241, 0.1)', drag: true, resize: true });
            });
            wsRegions.on('region-updated', (region) => { clip.start = region.start; clip.end = region.end; });
            clip.ws = ws;
        }

        function updateClip(id, key, val) {
            const clip = clips.find(c => c.id === id);
            if (clip) clip[key] = (key === 'hasGap') ? val : parseInt(val);
        }

        function deleteClip(id) {
            clips = clips.filter(c => c.id !== id);
            document.getElementById(`clip-${id}`).remove();
        }

        async function playClipLogic(clip) {
            const el = document.getElementById(`clip-${clip.id}`);
            const duration = clip.end - clip.start;

            for (let r = 0; r < clip.repeats; r++) {
                if (stopPlayback) break;
                clip.ws.setTime(clip.start);
                el.className = "clip-container is-playing";
                
                await new Promise(resolve => {
                    clip.ws.play(clip.start, clip.end);
                    const op = () => { clip.ws.un('pause', op); resolve(); };
                    clip.ws.on('pause', op);
                });

                if (stopPlayback) break;
                await new Promise(r => setTimeout(r, 100)); // راحة تقنية

                if (clip.hasGap) {
                    el.className = "clip-container is-waiting";
                    await new Promise(resolve => {
                        const t = setTimeout(resolve, duration * 1000);
                        if (stopPlayback) clearTimeout(t);
                    });
                }
                el.className = "clip-container";
            }
        }

        async function playSingle(id) {
            stopPlayback = false;
            const clip = clips.find(c => c.id === id);
            if (clip) await playClipLogic(clip);
        }

        playAllBtn.onclick = async () => {
            stopPlayback = false;
            playAllBtn.disabled = true;
            const infinite = document.getElementById('infiniteRepeat').checked;
            const totalCycles = parseInt(document.getElementById('allRepeats').value);
            
            let currentCycle = 0;
            while (infinite || currentCycle < totalCycles) {
                if (stopPlayback) break;
                currentCycle++;
                cycleStatus.innerText = infinite ? `دورة: ${currentCycle}` : `دورة: ${currentCycle} / ${totalCycles}`;
                
                for (const clip of clips) {
                    if (stopPlayback) break;
                    await playClipLogic(clip);
                }
            }
            
            cycleStatus.innerText = "";
            playAllBtn.disabled = false;
        };

        document.getElementById('stopBtn').onclick = () => {
            stopPlayback = true;
            clips.forEach(c => {
                c.ws.pause();
                const el = document.getElementById(`clip-${c.id}`);
                if (el) el.className = "clip-container";
            });
            playAllBtn.disabled = false;
        };

        // دالة التصدير البسيطة (WAV)
        document.getElementById('exportBtn').onclick = async () => {
            if (clips.length === 0) return;
            const audioCtx = new AudioContext();
            let totalDur = 0;
            const buffers = [];
            for (const clip of clips) {
                const res = await fetch(clip.url);
                const ab = await audioCtx.decodeAudioData(await res.arrayBuffer());
                const d = clip.end - clip.start;
                totalDur += (clip.hasGap ? d * 2 : d) * clip.repeats;
                buffers.push({ ab, clip, d });
            }
            const offCtx = new OfflineAudioContext(1, 44100 * totalDur, 44100);
            let offset = 0;
            for (const b of buffers) {
                for (let r = 0; r < b.clip.repeats; r++) {
                    const s = offCtx.createBufferSource();
                    s.buffer = b.ab; s.connect(offCtx.destination);
                    s.start(offset, b.clip.start, b.d);
                    offset += b.d;
                    if (b.clip.hasGap) offset += b.d;
                }
            }
            const rendered = await offCtx.startRendering();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(bufferToWav(rendered));
            a.download = "quran_session.wav"; a.click();
        };

        function bufferToWav(abuffer) {
            let n = abuffer.numberOfChannels, len = abuffer.length * n * 2 + 44,
                buf = new ArrayBuffer(len), view = new DataView(buf), pos = 0;
            const s32 = (d) => { view.setUint32(pos, d, true); pos += 4; };
            const s16 = (d) => { view.setUint16(pos, d, true); pos += 2; };
            s32(0x46464952); s32(len - 8); s32(0x45564157); s32(0x20746d66); s32(16); s16(1); s16(n);
            s32(abuffer.sampleRate); s32(abuffer.sampleRate * 2 * n); s16(n * 2); s16(16);
            s32(0x61746164); s32(len - pos - 4);
            for (let i = 0; i < abuffer.length; i++) {
                for (let ch = 0; ch < n; ch++) {
                    let s = Math.max(-1, Math.min(1, abuffer.getChannelData(ch)[i]));
                    view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true); pos += 2;
                }
            }
            return new Blob([buf], { type: "audio/wav" });
        }
    </script>
</body>
</html>
